/*
 * Оформление самого приложения (не слайдов — те рисуются на Canvas в
 * фирменных цветах и от темы не зависят). По образцу Card Maker: белый и
 * чёрный, кнопки-пилюли, карточки со скруглением и тонкой обводкой.
 *
 * Акценты, у каждого одна роль:
 *   --blue    выбор, фокус, прогресс
 *   --green   «всё хорошо»
 *   --red     удаление, ошибки
 *   --amber   предупреждения (текст не помещается, мелкое фото)
 *
 * Раскладка mobile-first: на телефоне редактор — это превью сверху,
 * лента слайдов и форма под ним, всё в высоту видимой области
 * (--app-h из visualViewport, чтобы клавиатура не уводила превью за экран).
 * От 900px — три колонки: слайды, превью, панель.
 *
 * Тёмные значения живут в двух блоках, которые нужно держать одинаковыми:
 * по системной настройке и по явному выбору (data-theme="dark").
 */

:root {
  --blue: #3A80FE;
  --green: #059458;
  --red: #C32B5B;
  --amber: #BF8300;

  --blue-soft: rgba(58, 128, 254, .12);
  --green-soft: rgba(5, 148, 88, .12);
  --red-soft: rgba(195, 43, 91, .10);
  --amber-soft: rgba(191, 131, 0, .13);

  --blue-text: #2A6FEA;
  --green-text: #047A49;
  --red-text: #B0244F;
  --amber-text: #8F6200;

  --bg: #F5F5F5;
  --surface: #FFFFFF;
  --well: #EDEDEE;
  --text: #0B0B0C;
  --muted: #6B6B72;
  --line: #E4E4E7;
  --line-strong: #D0D0D6;
  --hover: #F0F0F1;
  --input: #FFFFFF;
  --primary-bg: #0B0B0C;
  --primary-hover: #2A2A2E;
  --primary-text: #FFFFFF;
  --backdrop: rgba(11, 11, 12, .45);
  --focus: 0 0 0 3px rgba(58, 128, 254, .35);
  --shadow-pop: 0 12px 40px rgba(11, 11, 12, .16);
  --stage-bg: #E9E9EB;

  --radius: 20px;
  --radius-sm: 12px;
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --app-h: 100vh;
  --app-top: 0px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --blue-soft: rgba(58, 128, 254, .2);
    --green-soft: rgba(5, 148, 88, .2);
    --red-soft: rgba(195, 43, 91, .2);
    --amber-soft: rgba(191, 131, 0, .2);
    --blue-text: #7EAAFF;
    --green-text: #3CC98C;
    --red-text: #EE7FA2;
    --amber-text: #E6AE33;
    --bg: #0B0B0C;
    --surface: #151517;
    --well: #0F0F11;
    --text: #F4F4F5;
    --muted: #9A9AA2;
    --line: #26262B;
    --line-strong: #37373E;
    --hover: #1F1F23;
    --input: #111113;
    --primary-bg: #F4F4F5;
    --primary-hover: #D9D9DC;
    --primary-text: #0B0B0C;
    --backdrop: rgba(0, 0, 0, .65);
    --focus: 0 0 0 3px rgba(58, 128, 254, .5);
    --shadow-pop: 0 12px 40px rgba(0, 0, 0, .5);
    --stage-bg: #0F0F11;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --blue-soft: rgba(58, 128, 254, .2);
  --green-soft: rgba(5, 148, 88, .2);
  --red-soft: rgba(195, 43, 91, .2);
  --amber-soft: rgba(191, 131, 0, .2);
  --blue-text: #7EAAFF;
  --green-text: #3CC98C;
  --red-text: #EE7FA2;
  --amber-text: #E6AE33;
  --bg: #0B0B0C;
  --surface: #151517;
  --well: #0F0F11;
  --text: #F4F4F5;
  --muted: #9A9AA2;
  --line: #26262B;
  --line-strong: #37373E;
  --hover: #1F1F23;
  --input: #111113;
  --primary-bg: #F4F4F5;
  --primary-hover: #D9D9DC;
  --primary-text: #0B0B0C;
  --backdrop: rgba(0, 0, 0, .65);
  --focus: 0 0 0 3px rgba(58, 128, 254, .5);
  --shadow-pop: 0 12px 40px rgba(0, 0, 0, .5);
  --stage-bg: #0F0F11;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
html { touch-action: manipulation; }   /* без зума по двойному тапу */
body {
  font: 400 15px/1.45 var(--ui);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.grow { flex: 1; }

/* ------------------------------------------------------------- кнопки */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 44px; padding: 0 18px;
  border: 1px solid transparent; border-radius: 999px;
  background: var(--well); color: var(--text);
  font-weight: 600; font-size: 15px; white-space: nowrap;
  transition: background .15s, border-color .15s, opacity .15s;
}
.btn:hover { background: var(--hover); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .icon-btn:focus-visible, .tab:focus-visible { outline: none; box-shadow: var(--focus); }
.btn [data-icon], .btn svg { width: 18px; height: 18px; flex: none; display: inline-flex; }
.btn svg { width: 100%; height: 100%; }
.btn-primary { background: var(--primary-bg); color: var(--primary-text); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-outline { background: transparent; border-color: var(--line-strong); }
.btn-outline:hover { background: var(--hover); }
.btn-ghost { background: transparent; }
.btn-ghost:hover { background: var(--hover); }
.btn-danger { background: var(--red-soft); color: var(--red-text); }
.btn-danger:hover { background: var(--red-soft); filter: brightness(.97); }
.btn-invert { background: var(--primary-text); color: var(--primary-bg); }
.btn-sm { height: 36px; padding: 0 14px; font-size: 14px; }
.btn-lg { height: 54px; padding: 0 22px; font-size: 16px; }
.btn-block { width: 100%; }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; flex: none;
  border: 0; border-radius: 999px; background: transparent; color: var(--text);
  padding: 0;
}
.icon-btn:hover { background: var(--hover); }
.icon-btn:disabled { opacity: .3; cursor: default; background: transparent; }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn.sm { width: 34px; height: 34px; }
.icon-btn.sm svg { width: 18px; height: 18px; }
[data-icon] svg { display: block; }
span[data-icon] { display: inline-flex; flex: none; width: 18px; height: 18px; }
span[data-icon] svg { width: 100%; height: 100%; }

.chip {
  display: inline-flex; align-items: center; height: 26px; padding: 0 10px;
  border-radius: 999px; background: var(--well); color: var(--muted);
  font-size: 12.5px; font-weight: 600; white-space: nowrap;
}

/* ---------------------------------------------------------- стартовый */

.screen.home {
  max-width: 1180px; margin: 0 auto;
  padding: calc(8px + var(--safe-t)) 16px calc(40px + var(--safe-b));
}
.home-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0 18px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-logo {
  width: 48px; height: 48px; border-radius: 14px; background: #000; flex: none;
  display: flex; align-items: center; justify-content: center;
}
.brand-logo img { width: 36px; height: auto; display: block; }
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-name { font-weight: 800; font-size: 18px; letter-spacing: -.01em; line-height: 1.2; }
.brand-sub { color: var(--muted); font-size: 13px; line-height: 1.3; }
.head-actions { display: flex; gap: 4px; }

.section-head { display: flex; flex-direction: column; gap: 2px; margin: 10px 0 14px; }
.section-head h2 { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }

.font-note {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 14px 16px; margin: 0 0 18px;
  border-radius: var(--radius-sm); background: var(--amber-soft); color: var(--text);
  font-size: 14px;
}
.font-note [data-icon] { width: 20px; height: 20px; color: var(--amber-text); flex: none; margin-top: 1px; }
.font-note b { font-weight: 700; }
.font-note .btn { margin-top: 8px; }

.drafts { margin-bottom: 26px; }
.drafts-row {
  display: flex; gap: 12px; overflow-x: auto; padding: 2px 16px 10px; margin: 0 -16px;
  scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
}
.draft-card {
  position: relative; flex: none; width: 148px; scroll-snap-align: start;
  border: 1px solid var(--line); border-radius: 16px; background: var(--surface);
  padding: 8px; cursor: pointer; text-align: left;
}
.draft-card:hover { border-color: var(--line-strong); }
.draft-thumb { display: block; width: 100%; aspect-ratio: 4 / 5; border-radius: 10px; background: #000; overflow: hidden; }
.draft-thumb canvas { width: 100%; height: 100%; display: block; }
.draft-name { font-weight: 700; font-size: 14px; margin-top: 8px; line-height: 1.25;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.draft-meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.draft-del {
  position: absolute; top: 12px; right: 12px; width: 32px; height: 32px;
  border-radius: 999px; border: 0; background: rgba(0, 0, 0, .55); color: #fff;
  display: flex; align-items: center; justify-content: center; padding: 0;
}
.draft-del svg { width: 16px; height: 16px; }

.rubric-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.rubric-tile {
  display: flex; flex-direction: column; gap: 10px; text-align: left;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
  padding: 10px 10px 14px; cursor: pointer; transition: border-color .15s, transform .15s;
}
.rubric-tile:hover { border-color: var(--line-strong); }
.rubric-tile:active { transform: scale(.985); }
.rubric-art {
  position: relative; aspect-ratio: 1 / 1; border-radius: 14px; background: var(--well);
  overflow: hidden;
}
.rubric-art canvas { position: absolute; border-radius: 6px; box-shadow: 0 6px 18px rgba(0, 0, 0, .22); }
.rubric-art .back { transform: rotate(6deg); opacity: .95; }
.rubric-name { font-weight: 800; font-size: 16px; padding: 0 4px; letter-spacing: -.01em; }
.rubric-desc { color: var(--muted); font-size: 12.5px; padding: 0 4px; margin-top: -6px; line-height: 1.35; }

.home-extra { margin-top: 22px; display: flex; justify-content: center; }

/* ----------------------------------------------------------- редактор */

.screen.editor {
  position: fixed; left: 0; top: var(--app-top); width: 100%; height: var(--app-h);
  display: flex; flex-direction: column; background: var(--bg); overflow: hidden;
}

.topbar {
  display: flex; align-items: center; gap: 4px; flex: none;
  height: calc(56px + var(--safe-t)); padding: var(--safe-t) 8px 0;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.doc-title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.doc-title input {
  flex: 1; min-width: 0; height: 40px; padding: 0 10px;
  border: 1px solid transparent; border-radius: 10px; background: transparent;
  font-weight: 700; font-size: 16px; text-overflow: ellipsis;
}
.doc-title input:hover { background: var(--hover); }
.doc-title input:focus { outline: none; border-color: var(--line-strong); background: var(--input); }
.top-actions { display: flex; align-items: center; gap: 2px; }
/* на узком телефоне название проекта — во вкладке «Настройки», здесь место кнопкам */
@media (max-width: 599px) {
  .doc-title input { display: none; }
}
.btn-export { height: 40px; padding: 0 14px; margin-left: 4px; }

.workspace { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* превью: на телефоне сразу под верхней панелью, лента слайдов — под ним */
.stage-pane { flex: none; display: flex; flex-direction: column; background: var(--stage-bg); order: 1; }
.stage {
  position: relative; height: calc(var(--app-h) * .45 - 34px); min-height: 190px;
  display: flex; align-items: center; justify-content: center; padding: 10px;
  touch-action: none; user-select: none; -webkit-user-select: none;
  transition: height .2s ease;
}
.stage-inner { position: relative; box-shadow: 0 8px 28px rgba(0, 0, 0, .18); border-radius: 4px; overflow: hidden; }
.stage-inner canvas { display: block; }
.stage-overlay { position: absolute; inset: 0; pointer-events: none; }
.stage-overlay > * { pointer-events: auto; }
.stage.dragover .stage-inner { outline: 3px solid var(--blue); outline-offset: 3px; }

.photo-pill {
  position: absolute; transform: translate(-50%, -50%);
  display: inline-flex; align-items: center; gap: 8px;
  height: 42px; padding: 0 16px; border-radius: 999px; border: 0;
  background: rgba(255, 255, 255, .94); color: #0B0B0C;
  font-weight: 700; font-size: 14.5px; white-space: nowrap;
  box-shadow: 0 4px 16px rgba(0, 0, 0, .25);
}
.photo-pill [data-icon] { width: 18px; height: 18px; }
.pan-hint {
  position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
  width: max-content; max-width: 84%; padding: 8px 12px; border-radius: 12px;
  background: rgba(0, 0, 0, .7); color: #fff; text-align: center;
  font-size: 12.5px; font-weight: 600; line-height: 1.3; pointer-events: none !important;
  animation: fadeout 3.4s forwards;
}
@keyframes fadeout { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }

.stage-nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 36px; height: 36px; border-radius: 999px; border: 0; padding: 0;
  background: var(--surface); color: var(--text); box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
  display: flex; align-items: center; justify-content: center; opacity: .92;
}
.stage-nav svg { width: 18px; height: 18px; }
.stage-nav.prev { left: 6px; }
.stage-nav.next { right: 6px; }
.stage-nav:disabled { opacity: 0; pointer-events: none; }

.stage-foot {
  display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 12px 4px;
}
.warnings { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; font-weight: 600; }
.warn { display: inline-flex; align-items: center; gap: 6px; color: var(--amber-text); }
.warn.ok { color: var(--green-text); }
.warn [data-icon], .warn svg { width: 16px; height: 16px; }
.warn .btn { height: 30px; padding: 0 12px; font-size: 13px; }
.counter { color: var(--muted); font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; }

/* лента слайдов */
.slides-pane { flex: none; order: 2; background: var(--surface); border-bottom: 1px solid var(--line); }
.slides-list {
  display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden;
  padding: 8px 12px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.slides-list::-webkit-scrollbar { display: none; }
.slide-item {
  position: relative; flex: none; width: 48px; scroll-snap-align: center;
  border: 0; padding: 0; background: none; text-align: left;
}
.slide-thumb {
  position: relative; display: block; width: 100%; border-radius: 6px; overflow: hidden;
  background: #000; outline: 2px solid transparent; outline-offset: 2px;
  box-shadow: inset 0 0 0 1px var(--line);
}
.slide-thumb canvas { display: block; width: 100%; height: auto; }
.slide-item.current .slide-thumb { outline-color: var(--blue); }
.slide-num {
  position: absolute; left: 3px; bottom: 3px; min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 999px; background: rgba(0, 0, 0, .66); color: #fff;
  font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}
.slide-dot {
  position: absolute; right: 4px; top: 4px; width: 10px; height: 10px; border-radius: 50%;
  background: var(--amber); box-shadow: 0 0 0 2px #fff;
}
.slide-label { display: none; }
.slide-tools { display: none; }
.slide-item.drag-over .slide-thumb { outline-color: var(--blue); outline-style: dashed; }
.slide-add {
  flex: none; width: 48px; border: 1.5px dashed var(--line-strong); border-radius: 8px;
  background: transparent; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 11.5px; font-weight: 700; padding: 0;
}
.slide-add svg { width: 22px; height: 22px; }
.slide-add:hover { color: var(--text); border-color: var(--text); }

/* панель */
.panel { flex: 1; min-height: 0; order: 3; display: flex; flex-direction: column; background: var(--surface); }
.tabs {
  flex: none; display: flex; gap: 4px; padding: 6px 12px 0; border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.tab {
  height: 42px; padding: 0 12px; border: 0; background: none; color: var(--muted);
  font-weight: 700; font-size: 15px; border-bottom: 2.5px solid transparent; margin-bottom: -1px;
}
.tab.on { color: var(--text); border-bottom-color: var(--text); }
.panel-body {
  flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 14px 16px calc(28px + var(--safe-b));
}

.form-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.form-head .grow { min-width: 0; }
.form-kicker { color: var(--muted); font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.form-title { font-weight: 800; font-size: 18px; line-height: 1.2; }

.section { padding: 16px 0; border-top: 1px solid var(--line); }
.section:first-of-type { border-top: 0; padding-top: 4px; }
.section-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 800; font-size: 15px; margin-bottom: 12px; }
.section-title .btn { height: 32px; padding: 0 12px; font-size: 13px; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field:last-child { margin-bottom: 0; }
.field-label { font-weight: 700; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
.field-label .muted { font-weight: 500; }
.field-hint { color: var(--muted); font-size: 12.5px; }
.input, .textarea {
  width: 100%; border: 1px solid var(--line-strong); border-radius: 12px;
  background: var(--input); color: var(--text);
  padding: 11px 13px; font-size: 16px; line-height: 1.4; /* 16px — iOS не зумит при фокусе */
  transition: border-color .15s, box-shadow .15s;
}
.textarea { resize: none; min-height: 48px; overflow: hidden; display: block; }
.input:focus, .textarea:focus { outline: none; border-color: var(--blue); box-shadow: var(--focus); }
.input::placeholder, .textarea::placeholder { color: var(--muted); opacity: .7; }

.photo-row { display: flex; align-items: center; gap: 12px; }
.photo-thumb {
  width: 64px; height: 64px; border-radius: 12px; flex: none; overflow: hidden;
  background: repeating-linear-gradient(45deg, var(--well) 0 8px, var(--hover) 8px 16px);
  border: 1px solid var(--line);
}
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-actions { display: flex; flex-wrap: wrap; gap: 8px; }

.range-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) 48px; align-items: center; gap: 10px; margin-bottom: 10px; }
.range-row label { font-size: 14px; color: var(--muted); font-weight: 600; }
.range-row output { text-align: right; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--blue); height: 28px; }

.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.switch-row .lbl { font-weight: 600; font-size: 14.5px; }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line-strong); transition: background .15s; }
.switch span::after {
  content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .15s;
}
.switch input:checked + span { background: var(--green); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { box-shadow: var(--focus); }

.seg { display: flex; padding: 3px; border-radius: 999px; background: var(--well); gap: 2px; }
.seg button {
  flex: 1; height: 38px; border: 0; border-radius: 999px; background: transparent;
  font-weight: 700; font-size: 14px; color: var(--muted); padding: 0 10px; white-space: nowrap;
}
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }

.actions-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.actions-grid .btn { width: 100%; }

.font-status { display: flex; flex-direction: column; gap: 10px; }
.font-line { display: flex; align-items: center; gap: 10px; }
.font-line .name { flex: 1; min-width: 0; }
.font-line .name b { display: block; font-size: 14.5px; }
.font-line .name span { font-size: 12.5px; }
.badge { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.badge.ok { background: var(--green-soft); color: var(--green-text); }
.badge.warn { background: var(--amber-soft); color: var(--amber-text); }

/* ----------------------------------------------------- шторка (sheet) */

.sheet { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop { position: absolute; inset: 0; background: var(--backdrop); animation: fadein .18s; }
.sheet-card {
  position: relative; width: 100%; max-height: calc(var(--app-h) - 40px);
  display: flex; flex-direction: column;
  background: var(--surface); border-radius: 22px 22px 0 0;
  box-shadow: var(--shadow-pop); animation: slideup .22s ease;
  padding-bottom: var(--safe-b);
}
.sheet-grab { width: 40px; height: 5px; border-radius: 999px; background: var(--line-strong); margin: 8px auto 0; flex: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 4px 20px; flex: none; }
.sheet-head h3 { font-size: 19px; font-weight: 800; }
.sheet-body { overflow-y: auto; padding: 6px 20px 20px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
@keyframes slideup { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

.sheet-group { margin-bottom: 18px; }
.sheet-group:last-child { margin-bottom: 0; }
.sheet-group h4 { margin: 0 0 10px; font-size: 13px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.sheet-list { display: flex; flex-direction: column; gap: 8px; }
.sheet-list .btn { justify-content: flex-start; height: 52px; border-radius: 14px; padding: 0 16px; }
.sheet-list .btn .sub { margin-left: auto; color: inherit; opacity: .6; font-weight: 600; font-size: 13.5px; }
.sheet-note { color: var(--muted); font-size: 13px; margin-top: 10px; }

.layout-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.layout-opt {
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface);
  padding: 6px 6px 8px; display: flex; flex-direction: column; gap: 6px; text-align: left;
}
.layout-opt:hover { border-color: var(--line-strong); }
.layout-opt.current { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
.layout-opt canvas { width: 100%; height: auto; display: block; border-radius: 8px; background: #000; }
.layout-opt span { font-size: 12.5px; font-weight: 700; line-height: 1.25; padding: 0 2px; }

.progress { height: 6px; border-radius: 999px; background: var(--well); overflow: hidden; margin-top: 12px; }
.progress div { height: 100%; width: 0; background: var(--blue); transition: width .2s; }

.help { font-size: 14.5px; line-height: 1.55; }
.help h4 { font-size: 15px; font-weight: 800; margin: 16px 0 6px; }
.help h4:first-child { margin-top: 0; }
.help p { margin: 0 0 8px; }
.help ul { margin: 0 0 8px; padding-left: 20px; }
.help kbd { font: inherit; font-size: 12.5px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: var(--well); }

/* --------------------------------------------------- просмотр карусели */

.viewer {
  position: fixed; left: 0; top: var(--app-top); width: 100%; height: var(--app-h); z-index: 55;
  background: #0B0B0C; display: flex; flex-direction: column; animation: fadein .15s;
}
.viewer-top {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  height: calc(56px + var(--safe-t)); padding: var(--safe-t) 8px 0 20px; color: #fff;
}
.viewer-top .icon-btn { color: #fff; }
.viewer-top .icon-btn:hover { background: rgba(255, 255, 255, .12); }
.viewer-count { font-weight: 700; font-variant-numeric: tabular-nums; }
.viewer-track {
  flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  padding-bottom: var(--safe-b);
}
.viewer-track::-webkit-scrollbar { display: none; }
.viewer-slide {
  flex: none; width: 100%; height: 100%; scroll-snap-align: center; scroll-snap-stop: always;
  display: flex; align-items: center; justify-content: center;
}
.viewer-slide canvas { display: block; border-radius: 4px; }

/* ------------------------------------------------------------ прочее */

/* сообщения — сверху: снизу на телефоне клавиатура и поля формы */
.status {
  position: fixed; left: 50%; top: calc(var(--app-top) + 64px + var(--safe-t)); z-index: 60;
  transform: translate(-50%, -12px); opacity: 0; pointer-events: none;
  max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 14px;
  background: var(--primary-bg); color: var(--primary-text); font-weight: 600; font-size: 14.5px;
  box-shadow: var(--shadow-pop); transition: opacity .2s, transform .2s; text-align: center;
}
.status.show { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 900px) {
  .status { top: auto; bottom: 24px; transform: translate(-50%, 12px); }
}

.drop-hint {
  position: fixed; inset: 12px; z-index: 70; border: 3px dashed var(--blue); border-radius: 22px;
  background: var(--blue-soft); display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 800; color: var(--blue-text); pointer-events: none;
}

.install-banner {
  position: fixed; left: 12px; right: 12px; bottom: calc(12px + var(--safe-b)); z-index: 40;
  display: flex; align-items: center; gap: 10px; padding: 10px 8px 10px 16px;
  border-radius: 16px; background: var(--primary-bg); color: var(--primary-text);
  box-shadow: var(--shadow-pop); font-size: 14px; font-weight: 600;
}
.install-banner span { flex: 1; }
.install-banner .icon-btn { color: var(--primary-text); }
.install-banner .icon-btn:hover { background: rgba(127, 127, 127, .2); }

/* ------------------------------------------------ телефон: печатаем */
/* Клавиатура открыта — превью уменьшается, лента прячется, чтобы над
   полем было видно, как меняется слайд. */
@media (max-width: 899px) {
  /* предупреждения — плашкой поверх низа превью, отдельная строка не нужна */
  .stage-pane { position: relative; }
  .stage { height: calc(var(--app-h) * .45 - 8px); }
  .stage-foot {
    position: absolute; left: 0; right: 0; bottom: 0; min-height: 0;
    padding: 0 8px 6px; pointer-events: none; justify-content: center;
  }
  .stage-foot .warnings { flex: none; justify-content: center; }
  .stage-foot .warn, .stage-foot .warnings .btn { pointer-events: auto; }
  .stage-foot .warn {
    background: var(--surface); padding: 5px 10px; border-radius: 999px;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .18);
  }
  .stage-foot .warn.ok, .stage-foot .counter { display: none; }
  .stage-foot .warnings .btn { background: var(--surface); box-shadow: 0 2px 10px rgba(0, 0, 0, .18); }

  .editor.typing .stage { height: calc(var(--app-h) * .36 - 16px); min-height: 150px; padding: 8px; }
  .editor.typing .slides-pane,
  .editor.typing .stage-foot,
  .editor.typing .stage-nav { display: none; }
  .hide-sm { display: none !important; }
}
@media (max-width: 380px) {
  .export-label { display: none; }
  .btn-export { width: 44px; padding: 0 !important; }
}
@media (max-width: 420px) {
  .btn-export { padding: 0 12px; }
  .stage-foot .warn, .stage-foot .warnings .btn { font-size: 12px; }
  .topbar .icon-btn { width: 40px; }
  .range-row { grid-template-columns: 92px minmax(0, 1fr) 44px; }
}

/* ------------------------------------------------------ планшет/комп */
@media (min-width: 640px) {
  .rubric-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .sheet { align-items: center; }
  .sheet-card { width: min(560px, calc(100% - 32px)); border-radius: 22px; max-height: calc(100vh - 64px); padding-bottom: 0; }
  .sheet-grab { display: none; }
  .layout-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .draft-card { width: 170px; }
}
@media (min-width: 980px) {
  .rubric-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .screen.home { padding-top: 24px; }
}

@media (min-width: 900px) {
  .screen.editor { position: fixed; top: 0; height: 100vh; }
  .workspace {
    flex-direction: row;
    display: grid; grid-template-columns: 180px minmax(0, 1fr) 380px;
  }
  .slides-pane {
    grid-column: 1; grid-row: 1; border-bottom: 0; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .slides-list {
    flex-direction: column; overflow-x: hidden; overflow-y: auto; gap: 14px;
    padding: 14px 14px 20px; scroll-snap-type: none; flex: 1;
  }
  .slide-item { width: 100%; cursor: grab; }
  .slide-label {
    display: block; margin-top: 6px; font-size: 12.5px; font-weight: 600; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .slide-item.current .slide-label { color: var(--text); }
  .slide-tools {
    position: absolute; top: 6px; right: 6px; display: none; flex-direction: column; gap: 4px;
  }
  .slide-item:hover .slide-tools, .slide-item.current .slide-tools { display: flex; }
  .slide-tools button {
    width: 28px; height: 28px; border-radius: 999px; border: 0; padding: 0;
    background: rgba(255, 255, 255, .92); color: #0B0B0C; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .2);
  }
  .slide-tools button svg { width: 15px; height: 15px; }
  .slide-tools button.del { color: var(--red); }
  .slide-add { width: 100%; aspect-ratio: auto; height: 64px; flex-direction: row; gap: 8px; font-size: 14px; }

  .stage-pane { grid-column: 2; grid-row: 1; min-height: 0; }
  .stage { flex: 1; height: auto; padding: 28px; }
  .stage-nav { width: 40px; height: 40px; }
  .stage-nav.prev { left: 14px; }
  .stage-nav.next { right: 14px; }
  .stage-foot { padding: 0 20px 12px; min-height: 48px; }

  .panel { grid-column: 3; grid-row: 1; border-left: 1px solid var(--line); }
  .panel-body { padding: 18px 20px 32px; }
  .topbar { padding: 0 14px; height: 60px; gap: 6px; }
}

@media (min-width: 1280px) {
  .workspace { grid-template-columns: 200px minmax(0, 1fr) 420px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<!-- ========================================================= редактор -->
<main class="screen editor" id="editor" hidden aria-label="Редактор">

    <button type="button" class="icon-btn" id="btnHome" title="Все проекты" aria-label="Все проекты" data-icon="arrow-left"></button>
    <div class="doc-title">
      <input type="text" id="docName" aria-label="Название проекта" spellcheck="false" autocomplete="off" enterkeyhint="done">
      <span class="chip hide-sm" id="docRubric"></span>
    </div>
    <div class="top-actions">
      <button type="button" class="icon-btn" id="btnUndo" title="Отменить (⌘Z)" aria-label="Отменить" data-icon="arrow-counter-clockwise" disabled></button>
      <button type="button" class="icon-btn" id="btnRedo" title="Повторить (⌘⇧Z)" aria-label="Повторить" data-icon="arrow-clockwise" disabled></button>

      <button type="button" class="icon-btn hide-sm" id="btnHelp" title="Как пользоваться" aria-label="Как пользоваться" data-icon="question"></button>
      <button type="button" class="icon-btn theme-btn hide-sm" id="btnTheme" title="Тёмная тема" aria-label="Тема" data-icon="moon"></button>

 * Отрисовка слайдов «Город 24» на Canvas.
 *
 * Все размеры — в единицах макета Figma (пост 1440×1800, рилс 1080×1920)

 * задаётся снаружи через ctx.setTransform, поэтому переносы строк в превью
 * и в экспорте одинаковые.
 *
 * Координата «top» у текста — это верх прописных букв, а не верх строки:
 * в макете у всех текстов включён text-box-trim (cap height → baseline),
 * так что в Figma y текстового блока — это ровно линия прописных. Здесь
 * так же: baseline первой строки = top + высота прописных (capRatio).
 *
 * LAYOUTS — единственный источник правды для каждого макета: какие поля,
 * есть ли фото, стрелка, затемнение и сама функция отрисовки. Никаких
 * пиксельных значений вёрстки вне этого файла быть не должно.
 */

// Высота прописных в долях кегля — по макету (высоты текстовых блоков
// с text-box-trim): BravoRG 150px → 105, Nauryz 115px → 82, Inter 60px → 44.
// Реальная высота меряется в браузере (capRatio), эти числа — запас на
// случай, если measureText не отдаёт actualBoundingBoxAscent.
const CAP_DEFAULT = { title: 0.70, display: 0.713, body: 0.727 };

// Сжатие по горизонтали для запасных шрифтов. BravoRG очень узкий, и
// запасной Oswald без сжатия ломал бы строки совсем не так, как в макете.
// Пока настоящий шрифт не добавлен, app.js ставит сюда < 1; с настоящим
// шрифтом всегда 1.
const FONT_STRETCH = { title: 1, display: 1, body: 1 };
const INTER_LEAD = 1.21;   // «normal» межстрочный у Inter в Figma

const WHITE = '#ffffff';
const BLACK = '#000000';
const EVENT_RED = '#700004';

const capCache = new Map();
function resetCapCache() { capCache.clear(); }

function capRatio(ctx, font) {
  if (capCache.has(font)) return capCache.get(font);
  let ratio = CAP_DEFAULT[font];
  ctx.save();
  ctx.font = `400 100px ${FONT_FAMILY[font]}`;
  const m = ctx.measureText('НHЕ');
  ctx.restore();
  if (m && typeof m.actualBoundingBoxAscent === 'number' && m.actualBoundingBoxAscent > 20) {
    ratio = m.actualBoundingBoxAscent / 100;
  }
  capCache.set(font, ratio);
  return ratio;
}

/* ---------------------------------------------------- текст: перенос */

const HAS_LETTER_SPACING = typeof CanvasRenderingContext2D !== 'undefined' &&
  'letterSpacing' in CanvasRenderingContext2D.prototype;

/*
 * Короткие служебные слова не должны оставаться в конце строки —
 * такое слово переносится вместе со следующим.
 */
const GLUE_WORDS = new Set([
  'в', 'во', 'на', 'к', 'ко', 'с', 'со', 'у', 'о', 'об', 'обо', 'от', 'ото',
  'до', 'из', 'изо', 'за', 'по', 'под', 'над', 'при', 'про', 'для', 'без',
  'не', 'ни', 'и', 'а', 'но', 'да', 'же', 'ли', 'бы', 'то', 'как', 'что',
  'или', 'их', 'его', 'её', 'ее', 'мы', 'вы', 'он', 'она', 'они', 'я',
  'a', 'an', 'the', 'in', 'on', 'at', 'to', 'of', 'by', 'is', 'or', 'and',
]);

function isGlueWord(text) {
  const clean = text.replace(/[«»"'(„“]/g, '').toLowerCase();
  return clean.length > 0 && (clean.length <= 2 || GLUE_WORDS.has(clean));
}

const HYPHENS = '-‐–';

/* Слово с дефисами → куски, после каждого дефиса можно перенести строку
   (как в Figma: «Каракол-» / «Корумду»). */
function splitHyphens(word) {
  const out = [];
  let cur = '';
  for (let i = 0; i < word.length; i++) {
    cur += word[i];
    if (HYPHENS.includes(word[i]) && i > 0 && i < word.length - 1 && !HYPHENS.includes(word[i + 1])) {
      out.push(cur);
      cur = '';
    }
  }
  if (cur) out.push(cur);
  return out;
}

function setTracking(ctx, px) {
  if (HAS_LETTER_SPACING) ctx.letterSpacing = (px || 0).toFixed(2) + 'px';
}

function measureTracked(ctx, text, track, stretch = 1) {
  const w = ctx.measureText(text).width;
  return (HAS_LETTER_SPACING ? w : w + (track || 0) * [...text].length) * stretch;
}

function fillTracked(ctx, text, x, y, track) {
  if (HAS_LETTER_SPACING || !track) { ctx.fillText(text, x, y); return; }
  // старые браузеры без ctx.letterSpacing — посимвольно
  let cx = x;
  for (const ch of text) {
    ctx.fillText(ch, cx, y);
    cx += ctx.measureText(ch).width + track;
  }
}

/* Одна строка текста (без \n) → строки по ширине. */
function wrapLine(ctx, raw, track, maxWidth, stretch = 1) {
  const words = raw.split(/\s+/).filter(Boolean);
  // неразрывные куски: слово-«клей» + следующее слово, куски слова через дефис
  const units = [];
  for (let i = 0; i < words.length; i++) {
    const pieces = splitHyphens(words[i]);
    pieces.forEach((p, j) => units.push({ text: p, sep: j === 0 ? ' ' : '' }));
  }
  const groups = [];
  for (let i = 0; i < units.length; i++) {
    const prev = groups[groups.length - 1];
    const prevUnit = units[i - 1];
    const glued = prev && units[i].sep === ' ' && prevUnit && prevUnit.sep === ' ' &&
      !HYPHENS.includes(prevUnit.text.slice(-1)) && isGlueWord(prevUnit.text) &&
      (i < 2 || units[i - 1].sep === ' ');
    if (glued) prev.text += ' ' + units[i].text;
    else groups.push({ text: units[i].text, sep: units[i].sep });
  }
  const lines = [];
  let line = '';
  const limit = maxWidth * 1.002;
  for (const g of groups) {
    if (!line) { line = g.text; continue; }
    const candidate = line + g.sep + g.text;
    if (measureTracked(ctx, candidate, track, stretch) <= limit) line = candidate;
    else { lines.push(line); line = g.text; }
  }
  if (line) lines.push(line);
  return lines;
}

/*
 * Текстовый блок: раскладывает текст по строкам и считает высоту.
 * height — от верха прописных первой строки до базовой линии последней
 * (так же, как высоты текстов в макете с text-box-trim).
 */
function textBlock(ctx, text, st, scale = 1, maxWidth = 1e6) {
  const size = st.size * scale;
  const lead = st.lead ? st.lead * scale : size * INTER_LEAD;
  const track = (st.track || 0) * scale;
  const font = `${st.italic ? 'italic ' : ''}400 ${size}px ${FONT_FAMILY[st.font]}`;
  const stretch = FONT_STRETCH[st.font] || 1;
  ctx.save();
  ctx.font = font;
  setTracking(ctx, track);
  const lines = [];
  for (const raw of String(text || '').split('\n')) {
    if (!raw.trim()) { lines.push({ text: '', width: 0 }); continue; }
    for (const l of wrapLine(ctx, raw.trim(), track, maxWidth, stretch)) {
      lines.push({ text: l, width: measureTracked(ctx, l, track, stretch) });
    }
  }
  ctx.restore();
  // пустые строки по краям блока не рисуются и места не занимают
  while (lines.length && !lines[0].text) lines.shift();
  while (lines.length && !lines[lines.length - 1].text) lines.pop();
  const cap = capRatio(ctx, st.font) * size;
  const height = lines.length ? cap + (lines.length - 1) * lead : 0;
  const width = lines.reduce((m, l) => Math.max(m, l.width), 0);
  return { lines, size, lead, track, font, cap, height, width, maxWidth, st, stretch };
}

function drawBlock(ctx, b, x, capTop, color, align = 'left', alpha = 1) {
  if (!b || !b.lines.length) return;
  ctx.save();
  ctx.font = b.font;
  setTracking(ctx, b.track);
  ctx.fillStyle = color;
  ctx.globalAlpha *= alpha;
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  let base = capTop + b.cap;
  for (const line of b.lines) {
    if (line.text) {
      let lx = x;
      if (align === 'center') lx = x + (b.maxWidth - line.width) / 2;
      else if (align === 'right') lx = x + b.maxWidth - line.width;
      if (b.stretch !== 1) {
        ctx.save();
        ctx.translate(lx, 0);
        ctx.scale(b.stretch, 1);
        fillTracked(ctx, line.text, 0, base, b.track);
        ctx.restore();
      } else {
        fillTracked(ctx, line.text, lx, base, b.track);
      }
    }
    base += b.lead;
  }
  ctx.restore();
}

/* ------------------------------------------------------- фон и детали */

// Сетка линий на белых карточках: группа «линии на фоне», повёрнута на 6°,
// линии 1px чёрные с прозрачностью 15%. Координаты начала каждой линии —
// из макета (relativeTransform).
const GRID = {
  cos: 0.9945176839828491, sin: 0.10456832498311996,
  hLen: 3160.97, vLen: 2366.05,
  h: [[-1087.96, -246.15], [-1014.62, 451.40], [-977.94, 800.18], [-941.27, 1148.95],
      [-904.60, 1497.72], [-867.93, 1846.51]],
  v: [[-531.63, -276.43], [-182.86, -313.11], [165.92, -349.78], [514.69, -386.45],
      [863.47, -423.12], [1212.24, -459.80], [1561.02, -496.47], [1909.80, -533.14]],
};

function drawGrid(ctx) {
  ctx.save();
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (const [x, y] of GRID.h) {
    ctx.moveTo(x, y);
    ctx.lineTo(x + GRID.hLen * GRID.cos, y - GRID.hLen * GRID.sin);
  }
  for (const [x, y] of GRID.v) {
    ctx.moveTo(x, y);
    ctx.lineTo(x + GRID.vLen * GRID.sin, y + GRID.vLen * GRID.cos);
  }
  ctx.stroke();
  ctx.restore();
}

/* «Тень» — градиент от прозрачного к чёрному снизу карточки. */
function drawShade(ctx, W, H, top, strength) {
  if (!(strength > 0)) return;
  const g = ctx.createLinearGradient(0, top, 0, H);
  g.addColorStop(0, 'rgba(0, 0, 0, 0)');
  g.addColorStop(1, `rgba(0, 0, 0, ${Math.min(1, strength)})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, top, W, H - top);
}

// Логотип: в макете это маска 152×129 в правом верхнем углу (1198, 149),
// залитая белым или чёрным. Видимая часть знака — 1198…1350 × 148…278.
const LOGO_BOX = { x: 1198, y: 148, w: 152, h: 130 };
const LOGO_BOX_BOTTOM = { x: 1198, y: 1520, w: 152, h: 130 };

function drawLogo(ctx, env, box, color) {
  const logo = color === BLACK ? env.assets.logoBlack : env.assets.logoWhite;
  if (!logo) return;
  const iw = logo.width, ih = logo.height;
  const s = Math.min(box.w / iw, box.h / ih);
  const w = iw * s, h = ih * s;
  ctx.drawImage(logo, box.x + (box.w - w) / 2, box.y + (box.h - h) / 2, w, h);
}

// Стрелка «листай дальше»: линия 61px, толщина 10, скруглённые концы,
// наконечник-«галочка» под 45°.
function drawArrow(ctx, color, y = 1687) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(1285, y);
  ctx.lineTo(1346, y);
  ctx.moveTo(1346 - 32.5, y - 32.5);
  ctx.lineTo(1346, y);
  ctx.lineTo(1346 - 32.5, y + 32.5);
  ctx.stroke();
  ctx.restore();
}

/* ------------------------------------------------------------- фото */

function mediaSize(img) {
  return [img.naturalWidth || img.videoWidth || img.width, img.naturalHeight || img.videoHeight || img.height];
}

/*
 * Фото «по размеру области с обрезкой» (cover) с масштабом и сдвигом.
 * Сдвиг t.x/t.y — в единицах макета от центра, ограничивается так,
 * чтобы по краям области не было пустот. Возвращает применённый сдвиг.
 */
function drawCover(ctx, img, x, y, w, h, t = {}) {
  const [iw, ih] = mediaSize(img);
  if (!iw || !ih) return { x: 0, y: 0, scale: 1 };
  const base = Math.max(w / iw, h / ih);
  const zoom = Math.min(Math.max(t.zoom || 1, 1), 5);
  const s = base * zoom;
  const dw = iw * s, dh = ih * s;
  const mx = (dw - w) / 2, my = (dh - h) / 2;
  const ox = Math.min(Math.max(t.x || 0, -mx), mx);
  const oy = Math.min(Math.max(t.y || 0, -my), my);
  ctx.drawImage(img, x + (w - dw) / 2 + ox, y + (h - dh) / 2 + oy, dw, dh);
  return { x: ox, y: oy, scale: s };
}

function drawPhotoRect(ctx, env, x, y, w, h, fallback = BLACK) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  let applied = null;
  if (env.photo) applied = drawCover(ctx, env.photo, x, y, w, h, env.transform);
  else if (fallback) { ctx.fillStyle = fallback; ctx.fillRect(x, y, w, h); }
  ctx.restore();
  return { shape: 'rect', x, y, w, h, deg: 0, applied };
}

/* Фото в повёрнутой рамке (стопка фотографий, полароид). bleed — запас
   за край рамки, чтобы не просвечивал чёрный плейсхолдер под фото. */
function drawPhotoQuad(ctx, env, q, fallback = BLACK) {
  const b = q.bleed || 0;
  ctx.save();
  ctx.translate(q.cx, q.cy);
  ctx.rotate(q.deg * Math.PI / 180);
  ctx.beginPath();
  ctx.rect(-q.w / 2 - b, -q.h / 2 - b, q.w + 2 * b, q.h + 2 * b);
  ctx.clip();
  let applied = null;
  if (env.photo) applied = drawCover(ctx, env.photo, -q.w / 2 - b, -q.h / 2 - b, q.w + 2 * b, q.h + 2 * b, env.transform);
  else if (fallback) { ctx.fillStyle = fallback; ctx.fillRect(-q.w / 2 - b, -q.h / 2 - b, q.w + 2 * b, q.h + 2 * b); }
  ctx.restore();
  return { shape: 'quad', x: q.cx - q.w / 2, y: q.cy - q.h / 2, w: q.w, h: q.h, cx: q.cx, cy: q.cy, deg: q.deg, applied };
}

// Стопка фотографий («фотопленка не удалять!»): картинка стопки и
// повёрнутая на 5,65° область «фото ставить сюда» поверх неё.
const STACK = { x: 182.63, y: 382.83, w: 1069.46, h: 802.6 };
const STACK_PHOTO = { cx: 760.1, cy: 784.6, w: 865.43, h: 593.76, deg: 5.65, bleed: 2 };

// Полароид мероприятий: фото 627×688 повёрнуто на 0,97°, вокруг рамка
// (#FCFCFC, поля 26 / 47 сверху / 131 снизу) с мягкой тенью вверх-вправо.
const POLAROID = { cx: 407.4, cy: 641.2, w: 627.62, h: 687.87, deg: 0.97, bleed: 0.5,
                   side: 26, top: 47, bottom: 131 };

function drawPolaroidFrame(ctx, env) {
  const q = POLAROID;
  const k = env.k || 1;
  ctx.save();
  ctx.translate(q.cx, q.cy);
  ctx.rotate(q.deg * Math.PI / 180);
  const fx = -q.w / 2 - q.side, fy = -q.h / 2 - q.top;
  const fw = q.w + 2 * q.side, fh = q.h + q.top + q.bottom;
  // тень canvas задаётся в пикселях устройства — умножаем на масштаб
  ctx.shadowColor = 'rgba(0, 0, 0, 0.24)';
  ctx.shadowBlur = 22 * k;
  ctx.shadowOffsetX = 6 * k;
  ctx.shadowOffsetY = -6 * k;
  ctx.fillStyle = '#FCFCFC';
  ctx.fillRect(fx, fy, fw, fh);
  ctx.restore();
}

// Скрепка поверх полароида (в макете — картинка «Группа 3 1»):
// рисуется вектором, чтобы не мылилась при любом размере экспорта.
function drawPaperClip(ctx) {
  ctx.save();
  ctx.translate(718, 272);
  ctx.rotate(36 * Math.PI / 180);
  const path = new Path2D();
  path.moveTo(-24, -58);
  path.lineTo(-24, 85);
  path.arc(0, 85, 24, Math.PI, 0, true);
  path.lineTo(24, -89.5);
  path.arc(4.5, -89.5, 19.5, 0, -Math.PI, true);
  path.lineTo(-15, 55);
  path.arc(0, 55, 15, Math.PI, 0, true);
  path.lineTo(15, -52);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.18)';
  ctx.lineWidth = 9;
  ctx.save(); ctx.translate(2.5, 3); ctx.stroke(path); ctx.restore();
  ctx.strokeStyle = '#A3121D';
  ctx.lineWidth = 8;
  ctx.stroke(path);
  ctx.strokeStyle = '#E2454E';
  ctx.lineWidth = 5.2;
  ctx.stroke(path);
  ctx.strokeStyle = 'rgba(255, 214, 214, 0.9)';
  ctx.lineWidth = 1.8;
  ctx.save(); ctx.translate(-1.2, -0.8); ctx.stroke(path); ctx.restore();
  ctx.restore();
}

/* ------------------------------------------------------- поля слайда */

/*
 * Значение поля: введённый текст или, в превью, бледная подсказка.
 * В экспорте (env.ghost = false) пустое поле просто не рисуется.
 */
function fieldText(slide, env, key, layout) {
  const v = (slide.fields && slide.fields[key]) || '';
  if (v.trim()) return { text: v, ghost: false };
  if (env.ghost) return { text: placeholderFor(layout, key, env), ghost: true };
  return { text: '', ghost: false };
}

/* Подсказка для пустого поля: у макета может быть своя (строка или функция). */
function placeholderFor(layout, key, env = {}) {
  const own = layout.ph && layout.ph[key];
  if (typeof own === 'function') return own(env);
  return own || PLACEHOLDERS[key] || '';
}

const PLACEHOLDERS = {
  title: 'Заголовок',
  subtitle: 'подзаголовок',
  body: 'Текст карточки',
  address: 'Адрес',
  number: '11',
  label: 'мероприятий\nнедели в Астане',
  dates: '21.09-27.09',
  date: '19 сентября-7 октября',
  place: 'Место проведения',
};

const GHOST_ALPHA = 0.38;

function sizeScale(slide, group) {
  const s = slide.size && slide.size[group];
  return s ? Math.min(Math.max(s, 0.4), 1.6) : 1;
}

/* Блок + признак «подсказка» — чтобы рисовать бледным и не считать переполнение. */
function fieldBlock(ctx, slide, env, layout, key, st, group, maxWidth, transform) {
  const f = fieldText(slide, env, key, layout);
  let text = f.text;
  if (transform && text) text = transform(text);
  const b = textBlock(ctx, text, st, sizeScale(slide, group), maxWidth);
  b.ghost = f.ghost;
  b.alpha = f.ghost ? (typeof env.ghostAlpha === 'number' ? env.ghostAlpha : GHOST_ALPHA) : 1;
  return b;
}

function alphaOf(b) { return b ? b.alpha : 1; }
function real(b) { return b && !b.ghost && b.lines.length > 0; }

/* 📍 перед адресом и 📅 перед датой, если пользователь не поставил их сам. */
function withEmoji(emoji, spaced) {
  return text => {
    const t = text.trim();
    if (!t || /^\p{Extended_Pictographic}/u.test(t)) return text;
    return emoji + (spaced ? ' ' : '') + text;
  };
}

/*
 * Колонка текстов, прижатая к низу: у последнего блока базовая линия на
 * bottom, остальные выше с зазорами (от базовой линии верхнего блока до
 * верха прописных нижнего). Возвращает верх первого блока.
 */
function stackUp(items, bottom) {
  let y = bottom;
  let top = bottom;
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    if (!it.block || !it.block.lines.length) continue;
    it.top = y - it.block.height;
    top = it.top;
    y = it.top - (it.gapAbove || 0);
  }
  return top;
}

function stackDown(items, top) {
  let y = top;
  let bottom = top;
  let first = true;
  for (const it of items) {
    if (!it.block || !it.block.lines.length) continue;
    if (!first) y += it.gapAbove || 0;
    it.top = y;
    y += it.block.height;
    bottom = y;
    first = false;
  }
  return bottom;
}

/* ------------------------------------------------------------ макеты */

const COVER_BOTTOM = 1650;   // низ текста на всех обложках (отступ 150)
const MARGIN = 90;
const COL_W = 1260;
const LOGO_SAFE = 330;       // выше этой линии текст залезает на логотип

/* Обложка: фото на весь слайд, тень, логотип, заголовок + подзаголовок снизу. */
function renderCover(ctx, slide, env, L, spec) {
  const { W, H } = L;
  const photo = drawPhotoRect(ctx, env, 0, 0, W, H);
  drawShade(ctx, W, H, spec.shadeTop, shadeStrength(slide, L));
  drawLogo(ctx, env, LOGO_BOX, WHITE);
  if (arrowOn(slide, L)) drawArrow(ctx, WHITE);

  const center = spec.align === 'center';
  const maxW = spec.maxW || COL_W;
  const x = center ? (W - maxW) / 2 : MARGIN;
  const title = fieldBlock(ctx, slide, env, L, 'title', spec.title, 'title', maxW);
  const sub = fieldBlock(ctx, slide, env, L, 'subtitle', spec.sub, 'body', maxW);
  const items = [{ block: title }, { block: sub, gapAbove: 60 }];
  const top = stackUp(items, COVER_BOTTOM);
  drawBlock(ctx, title, x, items[0].top, WHITE, spec.align, alphaOf(title));
  drawBlock(ctx, sub, x, items[1].top, WHITE, spec.align, alphaOf(sub));
  const overflow = (real(title) || real(sub)) && top < LOGO_SAFE;
  return { overflow, photo };
}

function shadeStrength(slide, L) {
  if (!L.shade) return 0;
  const v = slide.opts && typeof slide.opts.shade === 'number' ? slide.opts.shade : 1;
  return Math.min(Math.max(v, 0), 1);
}

function arrowOn(slide, L) {
  if (!L.arrow) return false;
  const v = slide.opts && slide.opts.arrow;
  return v === undefined ? L.arrow === 'on' : Boolean(v);
}

/* Интервью — карточка: белый фон с сеткой, заголовок и текст сверху,
   логотип внизу справа. */
function renderInterviewCard(ctx, slide, env, L) {
  const { W, H } = L;
  ctx.fillStyle = WHITE; ctx.fillRect(0, 0, W, H);
  drawGrid(ctx);
  drawLogo(ctx, env, LOGO_BOX_BOTTOM, BLACK);
  const title = fieldBlock(ctx, slide, env, L, 'title', T.card150, 'title', COL_W);
  const body = fieldBlock(ctx, slide, env, L, 'body', T.body45, 'body', COL_W);
  const items = [{ block: title }, { block: body, gapAbove: 80 }];
  const bottom = stackDown(items, 150);
  drawBlock(ctx, title, MARGIN, items[0].top, BLACK, 'left', alphaOf(title));
  drawBlock(ctx, body, MARGIN, items[1].top, BLACK, 'left', alphaOf(body));
  return { overflow: (real(title) || real(body)) && bottom > 1480, photo: null };
}

/* Любимые места — карточка: стопка фотографий, текст по центру, стрелка. */
function renderFavoriteCard(ctx, slide, env, L) {
  const { W, H } = L;
  ctx.fillStyle = WHITE; ctx.fillRect(0, 0, W, H);
  drawGrid(ctx);
  drawLogo(ctx, env, { x: 1198, y: 149, w: 152, h: 130 }, BLACK);
  if (env.assets.stack) ctx.drawImage(env.assets.stack, STACK.x, STACK.y, STACK.w, STACK.h);
  const photo = drawPhotoQuad(ctx, env, STACK_PHOTO, env.assets.stack ? null : BLACK);
  if (arrowOn(slide, L)) drawArrow(ctx, BLACK);
  const maxW = 1253;
  const body = fieldBlock(ctx, slide, env, L, 'body', T.body45, 'body', maxW);
  drawBlock(ctx, body, (W - maxW) / 2, 1268, BLACK, 'center', alphaOf(body));
  return { overflow: real(body) && 1268 + body.height > 1650, photo };
}

/* Новые места — карточка: фото, тень, название, адрес и белая плашка
   с описанием. Всё прижато к низу (плашка заканчивается на 1650). */
function renderNewPlaceCard(ctx, slide, env, L) {
  const { W, H } = L;
  const photo = drawPhotoRect(ctx, env, 0, 0, W, H);
  drawShade(ctx, W, H, 882, shadeStrength(slide, L));
  drawLogo(ctx, env, LOGO_BOX, WHITE);

  const title = fieldBlock(ctx, slide, env, L, 'title', T.card150, 'title', COL_W);
  const addr = fieldBlock(ctx, slide, env, L, 'address', T.address50, 'body', COL_W, withEmoji('📍', true));
  const body = fieldBlock(ctx, slide, env, L, 'body', T.body50, 'body', 1076);

  let y = COVER_BOTTOM;
  let boxTop = y;
  if (body.lines.length) {
    const boxH = body.height + 150;
    boxTop = COVER_BOTTOM - boxH;
    ctx.save();
    ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
    ctx.shadowBlur = 4 * (env.k || 1);
    ctx.shadowOffsetY = 4 * (env.k || 1);
    ctx.fillStyle = WHITE;
    ctx.globalAlpha = body.ghost ? Math.min(1, body.alpha + 0.5) : 1;
    roundRect(ctx, MARGIN, boxTop, COL_W, boxH, 35);
    ctx.fill();
    ctx.restore();
    drawBlock(ctx, body, 182, boxTop + 75, BLACK, 'left', alphaOf(body));
    y = boxTop - 60;
  }
  const items = [{ block: title }, { block: addr, gapAbove: 25 }];
  const top = stackUp(items, y);
  drawBlock(ctx, title, MARGIN, items[0].top, WHITE, 'left', alphaOf(title));
  drawBlock(ctx, addr, MARGIN, items[1].top, WHITE, 'left', alphaOf(addr));
  const any = real(title) || real(addr) || real(body);
  return { overflow: any && Math.min(top, boxTop) < LOGO_SAFE, photo };
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* Мероприятия — обложка: большое число, подпись справа от него и даты. */
function renderEventsCover(ctx, slide, env, L) {
  const { W, H } = L;
  const photo = drawPhotoRect(ctx, env, 0, 0, W, H);
  drawShade(ctx, W, H, 882, shadeStrength(slide, L));
  drawLogo(ctx, env, LOGO_BOX, WHITE);

  const num = fieldBlock(ctx, slide, env, L, 'number', T.number500, 'title', 900);
  const dates = fieldBlock(ctx, slide, env, L, 'dates', T.dates120, 'body', COL_W);
  const labelX = num.lines.length ? MARGIN + num.width + 20 : MARGIN;
  const label = fieldBlock(ctx, slide, env, L, 'label', T.cover150, 'title', Math.max(300, 1350 - labelX));

  // даты прижаты к низу, число и подпись — на 100 выше (низы выровнены)
  let bottom = COVER_BOTTOM;
  if (dates.lines.length) {
    const datesTop = COVER_BOTTOM - dates.height;
    drawBlock(ctx, dates, MARGIN, datesTop, WHITE, 'left', alphaOf(dates));
    bottom = datesTop - 100;
    if (arrowOn(slide, L)) drawArrow(ctx, WHITE, datesTop + dates.cap / 2);
  } else if (arrowOn(slide, L)) {
    drawArrow(ctx, WHITE);
  }
  const numTop = bottom - num.height;
  const labelTop = bottom - label.height;
  drawBlock(ctx, num, MARGIN, numTop, WHITE, 'left', alphaOf(num));
  drawBlock(ctx, label, labelX, labelTop, WHITE, 'left', alphaOf(label));
  const any = real(num) || real(label) || real(dates);
  const top = Math.min(num.lines.length ? numTop : bottom, label.lines.length ? labelTop : bottom);
  const tooWide = real(num) && num.width > 1260 - 300;
  return { overflow: any && (top < LOGO_SAFE || tooWide), photo };
}

/* Мероприятия — карточка: полароид со скрепкой, справа название/дата/место,
   снизу описание. */
function renderEventCard(ctx, slide, env, L) {
  const { W, H } = L;
  ctx.fillStyle = WHITE; ctx.fillRect(0, 0, W, H);
  drawGrid(ctx);
  drawLogo(ctx, env, LOGO_BOX, BLACK);
  drawPolaroidFrame(ctx, env);
  const photo = drawPhotoQuad(ctx, env, POLAROID);
  drawPaperClip(ctx);

  const colX = 796, colW = 554;
  const title = fieldBlock(ctx, slide, env, L, 'title', T.event120, 'title', colW);
  const date = fieldBlock(ctx, slide, env, L, 'date', T.event65, 'body', colW, withEmoji('📅', true));
  const place = fieldBlock(ctx, slide, env, L, 'place', T.event65, 'body', 457, withEmoji('📍', false));
  const items = [{ block: title }, { block: date, gapAbove: 89 }, { block: place, gapAbove: 50 }];
  // колонка центрируется по высоте полароида (центр ≈ 682), но не выше логотипа
  const h = stackDown(items.map(i => Object.assign({}, i)), 0);
  let colTop = Math.max(LOGO_SAFE, 682 - h / 2);
  const colBottom = stackDown(items, colTop);
  drawBlock(ctx, title, colX, items[0].top, EVENT_RED, 'left', alphaOf(title));
  drawBlock(ctx, date, colX, items[1].top, BLACK, 'left', alphaOf(date));
  drawBlock(ctx, place, colX, items[2].top, BLACK, 'left', alphaOf(place));

  const body = fieldBlock(ctx, slide, env, L, 'body', T.body50t, 'body', 1217);
  drawBlock(ctx, body, 88, 1309, BLACK, 'left', alphaOf(body));
  const colOverflow = (real(title) || real(date) || real(place)) && colBottom > 1240;
  const bodyOverflow = real(body) && 1309 + body.height > 1710;
  return { overflow: colOverflow || bodyOverflow, photo };
}

/* Коммерция — карточка с фото сверху: полоса фото подстраивается под
   объём текста (текст прижат к низу, от фото до заголовка — 126). */
function renderCommerceTop(ctx, slide, env, L) {
  const { W, H } = L;
  ctx.fillStyle = WHITE; ctx.fillRect(0, 0, W, H);
  drawGrid(ctx);
  const title = fieldBlock(ctx, slide, env, L, 'title', T.card120, 'title', COL_W);
  const body = fieldBlock(ctx, slide, env, L, 'body', T.body50, 'body', COL_W);
  const items = [{ block: title }, { block: body, gapAbove: 70 }];
  let textTop = stackUp(items, COVER_BOTTOM);
  const hasText = title.lines.length || body.lines.length;
  let band = hasText ? textTop - 126 : 1151;
  let overflow = false;
  const MIN = 640, MAX = 1420;
  if (band < MIN) {
    band = MIN;
    stackDown(items, band + 126);
    overflow = (real(title) || real(body)) && (items[1].top || 0) + body.height > 1720;
  }
  band = Math.min(band, MAX);
  const photo = drawPhotoRect(ctx, env, 0, 0, W, band);
  drawLogo(ctx, env, LOGO_BOX, WHITE);
  drawBlock(ctx, title, MARGIN, items[0].top, BLACK, 'left', alphaOf(title));
  drawBlock(ctx, body, MARGIN, items[1].top, BLACK, 'left', alphaOf(body));
  return { overflow, photo };
}

/* Коммерция — карточка с фото снизу: текст сверху, под ним фото до низа. */
function renderCommerceBottom(ctx, slide, env, L) {
  const { W, H } = L;
  ctx.fillStyle = WHITE; ctx.fillRect(0, 0, W, H);
  drawGrid(ctx);
  const title = fieldBlock(ctx, slide, env, L, 'title', T.card120, 'title', COL_W);
  const body = fieldBlock(ctx, slide, env, L, 'body', T.body50, 'body', COL_W);
  const items = [{ block: title }, { block: body, gapAbove: 57 }];
  const bottom = stackDown(items, 150);
  const hasText = title.lines.length || body.lines.length;
  let bandTop = hasText ? bottom + 139 : 649;
  const MAX_TOP = 1160;
  const overflow = (real(title) || real(body)) && bandTop > MAX_TOP;
  bandTop = Math.min(Math.max(bandTop, 380), MAX_TOP);
  const photo = drawPhotoRect(ctx, env, 0, bandTop, W, H - bandTop);
  drawLogo(ctx, env, LOGO_BOX_BOTTOM, WHITE);
  drawBlock(ctx, title, MARGIN, items[0].top, BLACK, 'left', alphaOf(title));
  drawBlock(ctx, body, MARGIN, items[1].top, BLACK, 'left', alphaOf(body));
  return { overflow, photo };
}

/* Пост: заголовок крупно по центру снизу. */
function renderPost(ctx, slide, env, L) {
  const { W, H } = L;

  drawShade(ctx, W, H, 882, shadeStrength(slide, L));
  drawLogo(ctx, env, LOGO_BOX, WHITE);
  const maxW = 1135;
  const title = fieldBlock(ctx, slide, env, L, 'title', T.post200, 'title', maxW);
  const top = COVER_BOTTOM - title.height;
  drawBlock(ctx, title, (W - maxW) / 2, top, WHITE, 'center', alphaOf(title));
  return { overflow: real(title) && top < LOGO_SAFE, photo };
}

/* Рилс 1080×1920: логотип и заголовок в безопасной зоне обложки. */
function renderReels(ctx, slide, env, L) {
  const { W, H } = L;
  const photo = drawPhotoRect(ctx, env, 0, 0, W, H);

  const top = 1493 - title.height;
  drawBlock(ctx, title, (W - maxW) / 2, top, WHITE, 'center', alphaOf(title));
  return { overflow: real(title) && top < 680, photo };
}

  L.id = id;
  L.W = L.size[0];

/*
 * Рисует слайд. ctx уже отмасштабирован снаружи (setTransform) так, что
 * единица = пиксель макета; env.k — сколько пикселей устройства в единице
 * (нужно для теней, которые canvas не масштабирует).
 * env: { assets: {logoWhite, logoBlack, stack}, photo, transform, ghost, k }
 * Возвращает { overflow, photo } — photo описывает область фото для UI
 * (перетаскивание кадра, кнопка «Добавить фото»).
 */
function renderSlide(ctx, slide, env) {
  const L = LAYOUTS[slide.layout] || LAYOUTS['post'];
  ctx.save();
  ctx.fillStyle = BLACK;
  ctx.fillRect(0, 0, L.W, L.H);
  let res;
  try {
    res = L.render(ctx, slide, env, L) || {};
  } finally {
    if (HAS_LETTER_SPACING) ctx.letterSpacing = '0px';
    ctx.restore();
  }
  return res;
}

/*
 * Интерфейс конструктора «Город 24».
 *
 * Два экрана в одной странице: стартовый (рубрики + черновики) и редактор
 * (превью, лента слайдов, форма слайда, экспорт). Вся вёрстка слайдов —
 * в render.js (LAYOUTS), здесь только состояние, формы и жесты.
 *
 * Данные проекта: { id, name, rubric, slides: [slide] }, где
 *   slide = { id, layout, fields: {title, body, …}, opts: {arrow, shade},
 *             size: {title, body}, photo: {id, zoom, x, y} | null }
 * Черновики (без фото) — в localStorage (STORE_DRAFTS), сами фото — в
 * IndexedDB под ключом «<id проекта>/<id фото>», поэтому после перезагрузки
 * вкладки (на iPhone это бывает при каждом переключении в «Фото») всё на
 * месте. В памяти держим только уменьшенную копию для превью; для экспорта
 * фото каждый раз заново раскодируется из Blob — так не упираемся в лимит
 * памяти canvas на iOS.
 */

const STORE_DRAFTS = 'g24.drafts.v1';
const STORE_THEME = 'g24.theme.v1';
const STORE_PREFS = 'g24.prefs.v1';
const STORE_INSTALL_DISMISSED = 'g24.installDismissed.v1';

const PHOTO_MAX = 3200;       // длинная сторона хранимого фото (1440×1800 + запас на зум)

const ZOOM_MAX = 4;
const FIT_MIN = 0.6;          // «Уместить» не уменьшает кегль ниже 60% макета
const UPSCALE_WARN = 1.3;     // фото растягивается больше чем на 30% — будет мыльным
// запасные шрифты шире настоящих — сжимаем, чтобы строки ломались как в макете
const FALLBACK_STRETCH = { title: 0.78, display: 0.82 };
const UNDO_LIMIT = 100;

 * Рубрики = наборы макетов. slides — с чего начинается новый проект,

function iconSvg(name) {
  return (typeof ICONS !== 'undefined' && ICONS[name]) || '';
}

function paintIcons(root = document) {
  root.querySelectorAll('[data-icon]').forEach(node => {
    const svg = iconSvg(node.dataset.icon);
    if (svg && !node.dataset.painted) {
      node.insertAdjacentHTML('afterbegin', svg);
      node.dataset.painted = '1';
    }
  });
}

/* Короткий конструктор DOM-узлов. */
function h(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (value === null || value === undefined || value === false) continue;
    if (key === 'class') node.className = value;
    else if (key === 'text') node.textContent = value;
    else if (key === 'icon') node.innerHTML = iconSvg(value);
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else if (key in node && typeof value !== 'string') node[key] = value;
    else node.setAttribute(key, value === true ? '' : value);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}

function btn(cls, icon, label, onclick, title) {
  const b = h('button', { type: 'button', class: cls, title, onclick });
  if (icon) b.append(iconSpan(icon));
  if (label) b.append(document.createTextNode(label));
  return b;
}

function iconSpan(name) {
  return h('span', { 'data-icon': name, 'data-painted': '1', icon: name, 'aria-hidden': 'true' });
}

function iconBtn(icon, title, onclick, extra = '') {
  return h('button', { type: 'button', class: 'icon-btn ' + extra, title, 'aria-label': title, icon, onclick });
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function newId() {

}

function pluralRu(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

function formatAgo(ts) {
  const diff = Math.max(0, Date.now() - ts) / 1000;
  if (diff < 60) return 'только что';
  if (diff < 3600) { const m = Math.round(diff / 60); return m + ' ' + pluralRu(m, 'минуту', 'минуты', 'минут') + ' назад'; }
  if (diff < 86400) { const hr = Math.round(diff / 3600); return hr + ' ' + pluralRu(hr, 'час', 'часа', 'часов') + ' назад'; }
  return new Date(ts).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
}

// Имена файлов — латиницей: Chromium молча переименовывает скачивание

const TRANSLIT = { а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', е: 'e', ё: 'e', ж: 'zh', з: 'z', и: 'i',
  й: 'y', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p', р: 'r', с: 's', т: 't', у: 'u', ф: 'f',
  х: 'h', ц: 'ts', ч: 'ch', ш: 'sh', щ: 'sch', ъ: '', ы: 'y', ь: '', э: 'e', ю: 'yu', я: 'ya',
  ә: 'a', ғ: 'g', қ: 'k', ң: 'n', ө: 'o', ұ: 'u', ү: 'u', һ: 'h', і: 'i', ӣ: 'i', ӯ: 'u', ҳ: 'h', ҷ: 'j', ў: 'u' };
function fileSlug(text, fallback) {
  const slug = [...String(text || '').toLowerCase()].map(ch => (ch in TRANSLIT ? TRANSLIT[ch] : ch)).join('')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 50);
  return slug || fallback;
}

let deferredInstallPrompt = null;

function isStandaloneDisplay() {
  return Boolean((window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
    window.navigator.standalone);

  const text = document.getElementById('installBannerText');

  if (mode === 'ios') {
    text.textContent = 'Поставьте на телефон: «Поделиться» внизу Safari → «На экран «Домой»».';
    action.hidden = true;
  } else {
    text.textContent = 'Установите конструктор на телефон — иконка на экране, работает без интернета.';
    action.hidden = false;
  }

function wireInstallBanner() {
  let dismissed = false;
  try { dismissed = localStorage.getItem(STORE_INSTALL_DISMISSED) === '1'; } catch { /* не критично */ }
  if (dismissed || isStandaloneDisplay()) return;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredInstallPrompt = e;
    if (state.screen === 'home') showInstallBanner('android');
  });
  if (isIosDevice()) setTimeout(() => { if (state.screen === 'home') showInstallBanner('ios'); }, 1500);
  document.getElementById('installBannerAction').addEventListener('click', async () => {
    if (!deferredInstallPrompt) return;

  document.getElementById('installBannerClose').addEventListener('click', () => {
    hideInstallBanner();

/* ------------------------------------------------------------ IndexedDB */
/*
 * Хранилище фото и загруженных шрифтов/логотипа. Если IndexedDB недоступна
 * (приватный режим старого Safari), всё продолжает работать в памяти —
 * просто фото не переживут перезагрузку, о чём предупредит beforeunload.
 */
let dbPromise = null;
function openDb() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise(resolve => {
    try {
      if (!('indexedDB' in window)) { resolve(null); return; }
      const req = indexedDB.open('g24-media', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('files');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
      req.onblocked = () => resolve(null);
    } catch { resolve(null); }
  }).then(db => { state.idbOk = Boolean(db); return db; });
  return dbPromise;
}
async function idbRequest(mode, fn) {
  const db = await openDb();
  if (!db) return null;
  return new Promise(resolve => {
    try {
      const tx = db.transaction('files', mode);
      const req = fn(tx.objectStore('files'));
      tx.oncomplete = () => resolve(req ? req.result : true);
      tx.onerror = () => resolve(null);
      tx.onabort = () => resolve(null);
    } catch { resolve(null); }
  });
}
const idbPut = (key, value) => idbRequest('readwrite', s => s.put(value, key));
const idbGet = key => idbRequest('readonly', s => s.get(key));
const idbDel = key => idbRequest('readwrite', s => s.delete(key));
const idbKeys = () => idbRequest('readonly', s => s.getAllKeys());

async function deleteProjectMedia(projectId, keepIds = null) {
  const keys = await idbKeys();
  if (!keys) return;
  const prefix = projectId + '/';
  for (const key of keys) {
    if (typeof key !== 'string' || !key.startsWith(prefix)) continue;
    if (keepIds && keepIds.has(key.slice(prefix.length))) continue;
    await idbDel(key);
  }
}

/* Обрезает прозрачные поля — логотип встаёт в рамку по видимой части. */
function trimTransparent(img) {
  const [w, h] = mediaSize(img);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  let data;
  try { data = ctx.getImageData(0, 0, w, h).data; } catch { return c; }
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (data[(y * w + x) * 4 + 3] > 8) {
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
  }
  if (x1 < 0) return c;
  const out = document.createElement('canvas');
  out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
  out.getContext('2d').drawImage(c, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
  return out;
}

/* Логотип — маска: красим её в белый и чёрный, как заливки в макете. */
function tint(src, color) {
  const c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(src, 0, 0);
  ctx.globalCompositeOperation = 'source-in';
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, c.width, c.height);
  return c;
}

async function setLogoFrom(src) {

/* Раскодирование через <img>, а не createImageBitmap: <img> везде учитывает
   EXIF-поворот, а createImageBitmap в части версий Safari — нет, и
   вертикальные фото с iPhone ложились бы боком. */
function decodeBlob(blob) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.decoding = 'async';
    img.onload = () => { img._url = url; resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };
    img.src = url;
  });
}
function releaseImage(img) {
  if (!img) return;
  if (img._url) { URL.revokeObjectURL(img._url); img._url = null; img.removeAttribute('src'); }
  if (typeof img.close === 'function') img.close();
}

function downscale(src, max) {
  const [w, h] = mediaSize(src);
  const s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * s));
  c.height = Math.max(1, Math.round(h * s));
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, 0, 0, c.width, c.height);
  return c;
}

function canvasToBlob(canvas, type, quality) {
  return new Promise(resolve => canvas.toBlob(resolve, type, quality));
}

/*
 * Файл → фото проекта: уменьшаем до PHOTO_MAX (для хранения и экспорта) и
 * до PREVIEW_MAX (для превью), кладём в IndexedDB. Возвращает id фото.
 */
async function importPhoto(file) {
  let img;
  try { img = await decodeBlob(file); } catch {
    throw new Error('Не получилось открыть фото' + (/heic|heif/i.test(file.type + file.name) ? ' (HEIC — сохраните как JPEG)' : ''));
  }
  const [w, h] = mediaSize(img);
  let blob = file;
  let fw = w, fh = h;
  const plain = /image\/(jpeg|png|webp)/.test(file.type);
  if (Math.max(w, h) > PHOTO_MAX || !plain) {
    const big = downscale(img, PHOTO_MAX);
    fw = big.width; fh = big.height;
    blob = await canvasToBlob(big, 'image/jpeg', 0.92) || file;
    big.width = big.height = 0;
  }
  const prev = downscale(img, PREVIEW_MAX);
  releaseImage(img);
  const id = newId();
  media.set(id, { blob, prev, w: fw, h: fh });
  if (state.project) await idbPut(state.project.id + '/' + id, blob);
  return id;
}

/* Подгружает из IndexedDB фото, которых ещё нет в памяти. */
function ensureMedia(projectId, ids) {
  const jobs = [];
  for (const id of ids) {
    if (!id || media.has(id) || loadingMedia.has(id)) continue;
    const job = (async () => {
      const blob = await idbGet(projectId + '/' + id);
      if (!(blob instanceof Blob)) return;
      try {
        const img = await decodeBlob(blob);
        const [w, h] = mediaSize(img);
        media.set(id, { blob, prev: downscale(img, PREVIEW_MAX), w, h });
        releaseImage(img);
      } catch { /* битый файл — просто без фото */ }
    })().finally(() => loadingMedia.delete(id));
    loadingMedia.set(id, job);
    jobs.push(job);
  }
  return Promise.all(jobs);
}

function freeMedia() {
  for (const m of media.values()) { if (m.prev) { m.prev.width = 0; m.prev.height = 0; } }
  media.clear();
}
