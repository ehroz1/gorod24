/*
 * Оформление самого приложения (не слайдов — те рисуются на Canvas в
 * фирменных цветах и от темы не зависят). По образцу Card Maker: белый и
 * чёрный, кнопки-пилюли, карточки со скруглением и тонкой обводкой.
 *
 * Акценты, у каждого одна роль:
 *   --blue    выбор, фокус, прогресс
 *   --green   «всё хорошо»
 *   --red     удаление, ошибки
 *   --amber   предупреждения (текст не помещается, мелкое фото)
 *
 * Раскладка mobile-first: на телефоне редактор — это превью сверху,
 * лента слайдов и форма под ним, всё в высоту видимой области
 * (--app-h из visualViewport, чтобы клавиатура не уводила превью за экран).
 * От 900px — три колонки: слайды, превью, панель.
 *
 * Тёмные значения живут в двух блоках, которые нужно держать одинаковыми:
 * по системной настройке и по явному выбору (data-theme="dark").
 */

:root {
  --blue: #3A80FE;
  --green: #059458;
  --red: #C32B5B;
  --amber: #BF8300;

  --blue-soft: rgba(58, 128, 254, .12);
  --green-soft: rgba(5, 148, 88, .12);
  --red-soft: rgba(195, 43, 91, .10);
  --amber-soft: rgba(191, 131, 0, .13);

  --blue-text: #2A6FEA;
  --green-text: #047A49;
  --red-text: #B0244F;
  --amber-text: #8F6200;

  --bg: #F5F5F5;
  --surface: #FFFFFF;
  --well: #EDEDEE;
  --text: #0B0B0C;
  --muted: #6B6B72;
  --line: #E4E4E7;
  --line-strong: #D0D0D6;
  --hover: #F0F0F1;
  --input: #FFFFFF;
  --primary-bg: #0B0B0C;
  --primary-hover: #2A2A2E;
  --primary-text: #FFFFFF;
  --backdrop: rgba(11, 11, 12, .45);
  --focus: 0 0 0 3px rgba(58, 128, 254, .35);
  --shadow-pop: 0 12px 40px rgba(11, 11, 12, .16);
  --stage-bg: #E9E9EB;

  --radius: 20px;
  --radius-sm: 12px;
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --app-h: 100vh;
  --app-top: 0px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --blue-soft: rgba(58, 128, 254, .2);
    --green-soft: rgba(5, 148, 88, .2);
    --red-soft: rgba(195, 43, 91, .2);
    --amber-soft: rgba(191, 131, 0, .2);
    --blue-text: #7EAAFF;
    --green-text: #3CC98C;
    --red-text: #EE7FA2;
    --amber-text: #E6AE33;
    --bg: #0B0B0C;
    --surface: #151517;
    --well: #0F0F11;
    --text: #F4F4F5;
    --muted: #9A9AA2;
    --line: #26262B;
    --line-strong: #37373E;
    --hover: #1F1F23;
    --input: #111113;
    --primary-bg: #F4F4F5;
    --primary-hover: #D9D9DC;
    --primary-text: #0B0B0C;
    --backdrop: rgba(0, 0, 0, .65);
    --focus: 0 0 0 3px rgba(58, 128, 254, .5);
    --shadow-pop: 0 12px 40px rgba(0, 0, 0, .5);
    --stage-bg: #0F0F11;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --blue-soft: rgba(58, 128, 254, .2);
  --green-soft: rgba(5, 148, 88, .2);
  --red-soft: rgba(195, 43, 91, .2);
  --amber-soft: rgba(191, 131, 0, .2);
  --blue-text: #7EAAFF;
  --green-text: #3CC98C;
  --red-text: #EE7FA2;
  --amber-text: #E6AE33;
  --bg: #0B0B0C;
  --surface: #151517;
  --well: #0F0F11;
  --text: #F4F4F5;
  --muted: #9A9AA2;
  --line: #26262B;
  --line-strong: #37373E;
  --hover: #1F1F23;
  --input: #111113;
  --primary-bg: #F4F4F5;
  --primary-hover: #D9D9DC;
  --primary-text: #0B0B0C;
  --backdrop: rgba(0, 0, 0, .65);
  --focus: 0 0 0 3px rgba(58, 128, 254, .5);
  --shadow-pop: 0 12px 40px rgba(0, 0, 0, .5);
  --stage-bg: #0F0F11;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
html { touch-action: manipulation; }   /* без зума по двойному тапу */
body {
  font: 400 15px/1.45 var(--ui);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.grow { flex: 1; }

/* ------------------------------------------------------------- кнопки */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 44px; padding: 0 18px;
  border: 1px solid transparent; border-radius: 999px;
  background: var(--well); color: var(--text);
  font-weight: 600; font-size: 15px; white-space: nowrap;
  transition: background .15s, border-color .15s, opacity .15s;
}
.btn:hover { background: var(--hover); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .icon-btn:focus-visible, .tab:focus-visible { outline: none; box-shadow: var(--focus); }
.btn [data-icon], .btn svg { width: 18px; height: 18px; flex: none; display: inline-flex; }
.btn svg { width: 100%; height: 100%; }
.btn-primary { background: var(--primary-bg); color: var(--primary-text); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-outline { background: transparent; border-color: var(--line-strong); }
.btn-outline:hover { background: var(--hover); }
.btn-ghost { background: transparent; }
.btn-ghost:hover { background: var(--hover); }
.btn-danger { background: var(--red-soft); color: var(--red-text); }
.btn-danger:hover { background: var(--red-soft); filter: brightness(.97); }
.btn-invert { background: var(--primary-text); color: var(--primary-bg); }
.btn-sm { height: 36px; padding: 0 14px; font-size: 14px; }
.btn-lg { height: 54px; padding: 0 22px; font-size: 16px; }
.btn-block { width: 100%; }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; flex: none;
  border: 0; border-radius: 999px; background: transparent; color: var(--text);
  padding: 0;
}
.icon-btn:hover { background: var(--hover); }
.icon-btn:disabled { opacity: .3; cursor: default; background: transparent; }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn.sm { width: 34px; height: 34px; }
.icon-btn.sm svg { width: 18px; height: 18px; }
[data-icon] svg { display: block; }
span[data-icon] { display: inline-flex; flex: none; width: 18px; height: 18px; }
span[data-icon] svg { width: 100%; height: 100%; }

.chip {
  display: inline-flex; align-items: center; height: 26px; padding: 0 10px;
  border-radius: 999px; background: var(--well); color: var(--muted);
  font-size: 12.5px; font-weight: 600; white-space: nowrap;
}

/* ---------------------------------------------------------- стартовый */

.screen.home {
  max-width: 1180px; margin: 0 auto;
  padding: calc(8px + var(--safe-t)) 16px calc(40px + var(--safe-b));
}
.home-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0 18px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-logo {
  width: 48px; height: 48px; border-radius: 14px; background: #000; flex: none;
  display: flex; align-items: center; justify-content: center;
}
.brand-logo img { width: 36px; height: auto; display: block; }
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-name { font-weight: 800; font-size: 18px; letter-spacing: -.01em; line-height: 1.2; }
.brand-sub { color: var(--muted); font-size: 13px; line-height: 1.3; }
.head-actions { display: flex; gap: 4px; }

.section-head { display: flex; flex-direction: column; gap: 2px; margin: 10px 0 14px; }
.section-head h2 { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }

.font-note {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 14px 16px; margin: 0 0 18px;
  border-radius: var(--radius-sm); background: var(--amber-soft); color: var(--text);
  font-size: 14px;
}
.font-note [data-icon] { width: 20px; height: 20px; color: var(--amber-text); flex: none; margin-top: 1px; }
.font-note b { font-weight: 700; }
.font-note .btn { margin-top: 8px; }

.drafts { margin-bottom: 26px; }
.drafts-row {
  display: flex; gap: 12px; overflow-x: auto; padding: 2px 16px 10px; margin: 0 -16px;
  scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
}
.draft-card {
  position: relative; flex: none; width: 148px; scroll-snap-align: start;
  border: 1px solid var(--line); border-radius: 16px; background: var(--surface);
  padding: 8px; cursor: pointer; text-align: left;
}
.draft-card:hover { border-color: var(--line-strong); }
.draft-thumb { display: block; width: 100%; aspect-ratio: 4 / 5; border-radius: 10px; background: #000; overflow: hidden; }
.draft-thumb canvas { width: 100%; height: 100%; display: block; }
.draft-name { font-weight: 700; font-size: 14px; margin-top: 8px; line-height: 1.25;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.draft-meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.draft-del {
  position: absolute; top: 12px; right: 12px; width: 32px; height: 32px;
  border-radius: 999px; border: 0; background: rgba(0, 0, 0, .55); color: #fff;
  display: flex; align-items: center; justify-content: center; padding: 0;
}
.draft-del svg { width: 16px; height: 16px; }

.rubric-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.rubric-tile {
  display: flex; flex-direction: column; gap: 10px; text-align: left;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
  padding: 10px 10px 14px; cursor: pointer; transition: border-color .15s, transform .15s;
}
.rubric-tile:hover { border-color: var(--line-strong); }
.rubric-tile:active { transform: scale(.985); }
.rubric-art {
  position: relative; aspect-ratio: 1 / 1; border-radius: 14px; background: var(--well);
  overflow: hidden;
}
.rubric-art canvas { position: absolute; border-radius: 6px; box-shadow: 0 6px 18px rgba(0, 0, 0, .22); }
.rubric-art .back { transform: rotate(6deg); opacity: .95; }
.rubric-name { font-weight: 800; font-size: 16px; padding: 0 4px; letter-spacing: -.01em; }
.rubric-desc { color: var(--muted); font-size: 12.5px; padding: 0 4px; margin-top: -6px; line-height: 1.35; }

.home-extra { margin-top: 22px; display: flex; justify-content: center; }

/* «Собрать карусель из текста» — только на стартовом экране */
.magic { margin: 0 0 22px; }
.magic-btn {
  width: 100%; display: flex; align-items: center; gap: 14px; text-align: left;
  padding: 14px 14px 14px 16px; border-radius: 18px; border: 0; color: #111;
  background: linear-gradient(120deg, #FEF3BD 0%, #FFE08A 55%, #F9C6B4 100%);
  box-shadow: 0 6px 20px rgba(112, 0, 4, .12);
}
.magic-btn:active { transform: scale(.99); }
.magic-ico {
  width: 44px; height: 44px; flex: none; border-radius: 14px; background: #111; color: #FEF3BD;
  display: flex; align-items: center; justify-content: center;
}
.magic-ico svg { width: 24px; height: 24px; }
.magic-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.magic-text b { font-size: 16px; font-weight: 800; }
.magic-text span { font-size: 13px; opacity: .75; }
.magic-arrow { width: 20px; height: 20px; flex: none; opacity: .6; }
.magic-arrow svg { width: 100%; height: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn {
  height: 34px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--text); font-weight: 600; font-size: 14px;
}
.chip-btn.on { background: var(--text); color: var(--surface); border-color: var(--text); }
.magic-hint { margin-top: 8px; }
.magic-input { min-height: 150px; max-height: 42vh; overflow-y: auto; }
.magic-input.is-empty::before { white-space: pre-wrap; }
.magic-summary { font-size: 14px; }
.magic-total { font-weight: 800; margin-bottom: 6px; }
.magic-list { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; }
.magic-list li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.magic-photos { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.magic-go { height: 50px; font-size: 16px; }

/* ----------------------------------------------------------- редактор */

.screen.editor {
  position: fixed; left: 0; top: var(--app-top); width: 100%; height: var(--app-h);
  display: flex; flex-direction: column; background: var(--bg); overflow: hidden;
}

.topbar {
  display: flex; align-items: center; gap: 4px; flex: none;
  height: calc(56px + var(--safe-t)); padding: var(--safe-t) 8px 0;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.doc-title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.doc-title input {
  flex: 1; min-width: 0; height: 40px; padding: 0 10px;
  border: 1px solid transparent; border-radius: 10px; background: transparent;
  font-weight: 700; font-size: 16px; text-overflow: ellipsis;
}
.doc-title input:hover { background: var(--hover); }
.doc-title input:focus { outline: none; border-color: var(--line-strong); background: var(--input); }
.top-actions { display: flex; align-items: center; gap: 2px; }
/* на узком телефоне название проекта — во вкладке «Настройки», здесь место кнопкам */
@media (max-width: 599px) {
  .doc-title input { display: none; }
}
.btn-export { height: 40px; padding: 0 14px; margin-left: 4px; }

.workspace { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* превью: на телефоне сразу под верхней панелью, лента слайдов — под ним */
.stage-pane { flex: none; display: flex; flex-direction: column; background: var(--stage-bg); order: 1; }
.stage {
  position: relative; height: calc(var(--app-h) * .45 - 34px); min-height: 190px;
  display: flex; align-items: center; justify-content: center; padding: 10px;
  touch-action: none; user-select: none; -webkit-user-select: none;
  transition: height .2s ease;
}
.stage-inner { position: relative; box-shadow: 0 8px 28px rgba(0, 0, 0, .18); border-radius: 4px; overflow: hidden; }
.stage-inner canvas { display: block; }
.stage-overlay { position: absolute; inset: 0; pointer-events: none; }
.stage-overlay > * { pointer-events: auto; }
.stage.dragover .stage-inner { outline: 3px solid var(--blue); outline-offset: 3px; }

.photo-pill {
  position: absolute; transform: translate(-50%, -50%);
  display: inline-flex; align-items: center; gap: 8px;
  height: 42px; padding: 0 16px; border-radius: 999px; border: 0;
  background: rgba(255, 255, 255, .94); color: #0B0B0C;
  font-weight: 700; font-size: 14.5px; white-space: nowrap;
  box-shadow: 0 4px 16px rgba(0, 0, 0, .25);
}
.photo-pill [data-icon] { width: 18px; height: 18px; }
/* видео на превью: «▶ 0:12» в левом верхнем углу слайда (справа — логотип) */
.media-pill {
  position: absolute; left: 10px; top: 10px;
  display: inline-flex; align-items: center; gap: 6px;
  height: 36px; padding: 0 14px 0 10px; border-radius: 999px; border: 0;
  background: rgba(0, 0, 0, .66); color: #fff; font-weight: 700; font-size: 13.5px;
  font-variant-numeric: tabular-nums; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.media-pill [data-icon] { width: 18px; height: 18px; }
.trim-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
.trim-foot .field-hint { flex: 1; min-width: 150px; }
.warn-text { color: var(--amber-text) !important; font-weight: 600; }

.pan-hint {
  position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
  width: max-content; max-width: 84%; padding: 8px 12px; border-radius: 12px;
  background: rgba(0, 0, 0, .7); color: #fff; text-align: center;
  font-size: 12.5px; font-weight: 600; line-height: 1.3; pointer-events: none !important;
  animation: fadeout 3.4s forwards;
}
@keyframes fadeout { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }

.stage-nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 36px; height: 36px; border-radius: 999px; border: 0; padding: 0;
  background: var(--surface); color: var(--text); box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
  display: flex; align-items: center; justify-content: center; opacity: .92;
}
.stage-nav svg { width: 18px; height: 18px; }
.stage-nav.prev { left: 6px; }
.stage-nav.next { right: 6px; }
.stage-nav:disabled { opacity: 0; pointer-events: none; }

.stage-foot {
  display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 12px 4px;
}
.warnings { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; font-weight: 600; }
.warn { display: inline-flex; align-items: center; gap: 6px; color: var(--amber-text); }
.warn.ok { color: var(--green-text); }
.warn [data-icon], .warn svg { width: 16px; height: 16px; }
.warn .btn { height: 30px; padding: 0 12px; font-size: 13px; }
.counter { color: var(--muted); font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; }

/* лента слайдов */
.slides-pane { flex: none; order: 2; background: var(--surface); border-bottom: 1px solid var(--line); }
.slides-list {
  display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden;
  padding: 8px 12px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.slides-list::-webkit-scrollbar { display: none; }
.slide-item {
  position: relative; flex: none; width: 48px; scroll-snap-align: center;
  border: 0; padding: 0; background: none; text-align: left;
}
.slide-thumb {
  position: relative; display: block; width: 100%; border-radius: 6px; overflow: hidden;
  background: #000; outline: 2px solid transparent; outline-offset: 2px;
  box-shadow: inset 0 0 0 1px var(--line);
}
.slide-thumb canvas { display: block; width: 100%; height: auto; }
.slide-item.current .slide-thumb { outline-color: var(--blue); }
.slide-num {
  position: absolute; left: 3px; bottom: 3px; min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 999px; background: rgba(0, 0, 0, .66); color: #fff;
  font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}
.slide-dot {
  position: absolute; right: 4px; top: 4px; width: 10px; height: 10px; border-radius: 50%;
  background: var(--amber); box-shadow: 0 0 0 2px #fff;
}
.slide-video {
  position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 6px;
  background: rgba(0, 0, 0, .66); color: #fff; display: flex; align-items: center; justify-content: center;
}
.slide-video [data-icon] { width: 12px; height: 12px; }
.slide-label { display: none; }
.slide-tools { display: none; }
.slide-item.drag-over .slide-thumb { outline-color: var(--blue); outline-style: dashed; }
.slide-add {
  flex: none; width: 48px; border: 1.5px dashed var(--line-strong); border-radius: 8px;
  background: transparent; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 11.5px; font-weight: 700; padding: 0;
}
.slide-add svg { width: 22px; height: 22px; }
.slide-add:hover { color: var(--text); border-color: var(--text); }

/* панель */
.panel { flex: 1; min-height: 0; order: 3; display: flex; flex-direction: column; background: var(--surface); }
.tabs {
  flex: none; display: flex; gap: 4px; padding: 6px 12px 0; border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.tab {
  height: 42px; padding: 0 12px; border: 0; background: none; color: var(--muted);
  font-weight: 700; font-size: 15px; border-bottom: 2.5px solid transparent; margin-bottom: -1px;
}
.tab.on { color: var(--text); border-bottom-color: var(--text); }
.panel-body {
  flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 14px 16px calc(28px + var(--safe-b));
}

.form-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.form-head .grow { min-width: 0; }
.form-kicker { color: var(--muted); font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.form-title { font-weight: 800; font-size: 18px; line-height: 1.2; }

.section { padding: 16px 0; border-top: 1px solid var(--line); }
.section:first-of-type { border-top: 0; padding-top: 4px; }
.section-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 800; font-size: 15px; margin-bottom: 12px; }
.section-title .btn { height: 32px; padding: 0 12px; font-size: 13px; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field:last-child { margin-bottom: 0; }
.field-label { font-weight: 700; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
.field-label .muted { font-weight: 500; }
.field-hint { color: var(--muted); font-size: 12.5px; }
.glyph-warn { color: var(--amber-text) !important; font-weight: 600; display: block !important; }
.glyph-warn[hidden] { display: none !important; }
.field-tools { display: inline-flex; align-items: center; gap: 10px; font-weight: 500; }
.field.off .input, .field.off .textarea { opacity: .45; }
.field.off .field-label > span:first-child { color: var(--muted); text-decoration: line-through; }
/* доп. блок «заголовок + текст» (карточка интервью) */
.subblock { margin: 18px 0 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
.subblock-head { display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin: -6px -6px 6px 0; color: var(--muted); font-size: 12.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .04em; }
.add-section { width: 100%; margin-top: 4px; }
.switch.sm { width: 40px; height: 24px; }
.switch.sm span::after { width: 18px; height: 18px; }
.switch.sm input:checked + span::after { transform: translateX(16px); }
.input, .textarea {
  width: 100%; border: 1px solid var(--line-strong); border-radius: 12px;
  background: var(--input); color: var(--text);
  padding: 11px 13px; font-size: 16px; line-height: 1.4; /* 16px — iOS не зумит при фокусе */
  transition: border-color .15s, box-shadow .15s;
}
.textarea { resize: none; min-height: 48px; overflow: hidden; display: block; }
.input:focus, .textarea:focus { outline: none; border-color: var(--blue); box-shadow: var(--focus); }
.input::placeholder, .textarea::placeholder { color: var(--muted); opacity: .7; }

/* поле с жирным и курсивом (contenteditable) */
.rich {
  position: relative; white-space: pre-wrap; overflow-wrap: anywhere; cursor: text;
  font-weight: 400; font-style: normal; user-select: text; -webkit-user-select: text;
}
.rich.big { min-height: 112px; }
.rich b, .rich strong { font-weight: 700; }
.rich.is-empty::before {
  content: attr(data-placeholder); position: absolute; left: 14px; right: 14px; top: 11px;
  color: var(--muted); opacity: .7; pointer-events: none;
}
/* строка с «Ж / К» прилипает к верху панели, пока поле на экране — на
   телефоне с клавиатурой длинный текст иначе уводит кнопки из виду */
.rich-field .field-label {
  align-items: center; position: sticky; top: -1px; z-index: 2;
  background: var(--surface); padding: 6px 0; margin: -6px 0 0;
}
.rich-field .field-hint { margin-top: -2px; }
.fmt-tools { display: inline-flex; gap: 4px; flex: none; }
.fmt-btn {
  min-width: 34px; height: 30px; padding: 0 9px; border-radius: 8px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--text);
  font-size: 14px; line-height: 1; font-weight: 500;
}
.fmt-btn:hover { background: var(--hover); }
.fmt-btn.fmt-bold { font-weight: 800; }
.fmt-btn.fmt-italic { font-style: italic; font-family: Georgia, 'Times New Roman', serif; font-size: 16px; }
.fmt-btn.fmt-plain { font-size: 12.5px; color: var(--muted); }
.fmt-btn.on { background: var(--text); color: var(--surface); border-color: var(--text); }
/* цвет и маркер: кружок цвета, «А» на кремовой плашке */
.fmt-dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25); }
.fmt-red .fmt-dot { background: #700004; }
.fmt-cream .fmt-dot { background: #FEF3BD; }
.fmt-marker { font-weight: 800; }
.fmt-btn.fmt-marker, .fmt-pop-btn.fmt-marker { background-image: linear-gradient(transparent 22%, #FEF3BD 22%, #FEF3BD 82%, transparent 82%); background-size: 60% 100%; background-repeat: no-repeat; background-position: center; color: #000; }
.fmt-btn.fmt-marker.on, .fmt-pop-btn.fmt-marker.on { outline: 2px solid var(--blue); outline-offset: -2px; }
.fmt-red.on .fmt-dot, .fmt-cream.on .fmt-dot { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--blue); }
.fmt-pop-btn[hidden] { display: none; }
/* маркер в поле: текст на кремовой плашке — тёмный и в тёмной теме */
.rich span[style*="background-color"] { color: #111 !important; border-radius: 3px; }
.field-label { flex-wrap: wrap; row-gap: 4px; }

/* всплывающая панель «Ж · К · Обычный» у выделенного текста (телефон) */
.fmt-pop {
  position: fixed; left: 0; top: 0; z-index: 45; display: flex; gap: 2px; padding: 4px;
  border-radius: 14px; background: var(--text); color: var(--surface);
  box-shadow: 0 6px 24px rgba(0, 0, 0, .28); will-change: transform;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.fmt-pop[hidden] { display: none; }
.fmt-pop-btn {
  min-width: 38px; height: 44px; padding: 0 8px; border: 0; border-radius: 10px;
  background: transparent; color: inherit; font-size: 17px; font-weight: 500; line-height: 1;
}
.fmt-pop-btn.fmt-bold { font-weight: 800; }
.fmt-pop-btn.fmt-italic { font-style: italic; font-family: Georgia, 'Times New Roman', serif; font-size: 19px; }
.fmt-pop-btn.fmt-plain { font-size: 15px; }
@media (max-width: 360px) {
  .fmt-pop { gap: 0; padding: 3px; }
  .fmt-pop-btn { min-width: 34px; padding: 0 6px; font-size: 16px; }
  .fmt-pop-btn.fmt-plain { font-size: 13.5px; }
}
.fmt-pop-btn.on { background: var(--surface); color: var(--text); }
/* у поля с форматированием снизу запас — чтобы под выделением поместилась панель */
@media (hover: none) { .rich-field { scroll-margin-bottom: 84px; } }

/* выравнивание и расположение текста */
.look-row { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px;
  flex-wrap: wrap; min-height: 44px; margin-bottom: 6px; }
.look-row .lbl { font-weight: 600; font-size: 14.5px; }
.look-row .seg { flex: none; }
.look-row .seg button { flex: none; height: 34px; font-size: 13px; padding: 0 11px; }
.seg.icons button { width: 40px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
.seg.icons button svg { width: 18px; height: 18px; }
.look-all { margin: 2px 0 10px; }

/* логотип: схема слайда с 8 точками */
.logo-row { align-items: flex-start; padding: 4px 0 8px; }
.lbl-col { display: flex; flex-direction: column; gap: 2px; padding-top: 6px; }
.logo-pick {
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
  width: 112px; height: 140px; padding: 3px; border-radius: 12px; flex: none;
  background: var(--well); border: 1px solid var(--line-strong);
}
.logo-pick button {
  border: 0; background: transparent; border-radius: 9px; min-height: 36px;
  display: flex; align-items: center; justify-content: center; padding: 0;
}
.logo-pick button span {
  width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--muted);
  transition: transform .12s, background .12s;
}
.logo-pick button:hover { background: var(--hover); }
.logo-pick button.on span { background: var(--text); border-color: var(--text); transform: scale(1.35); }
.logo-pick button:focus-visible { outline: none; box-shadow: var(--focus); }
.logo-pick.tall { width: 96px; height: 170px; }

.photo-row { display: flex; align-items: center; gap: 12px; }
.photo-thumb {
  width: 64px; height: 64px; border-radius: 12px; flex: none; overflow: hidden;
  background: repeating-linear-gradient(45deg, var(--well) 0 8px, var(--hover) 8px 16px);
  border: 1px solid var(--line);
}
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-actions { display: flex; flex-wrap: wrap; gap: 8px; }

.range-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) 48px; align-items: center; gap: 10px; margin-bottom: 10px; }
.range-row label { font-size: 14px; color: var(--muted); font-weight: 600; }
.range-row output { text-align: right; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--blue); height: 28px; }

.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.switch-row .lbl { font-weight: 600; font-size: 14.5px; display: inline-flex; align-items: center; gap: 8px; }
.swatch { width: 18px; height: 18px; border-radius: 50%; background: #FEF3BD; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .18); flex: none; }
.tone-hint { margin: -4px 0 6px; }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line-strong); transition: background .15s; }
.switch span::after {
  content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .15s;
}
.switch input:checked + span { background: var(--green); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { box-shadow: var(--focus); }

.seg { display: flex; padding: 3px; border-radius: 999px; background: var(--well); gap: 2px; }
.seg button {
  flex: 1; height: 38px; border: 0; border-radius: 999px; background: transparent;
  font-weight: 700; font-size: 14px; color: var(--muted); padding: 0 10px; white-space: nowrap;
}
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }

.actions-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.actions-grid .btn { width: 100%; }

.font-status { display: flex; flex-direction: column; gap: 10px; }
.font-line { display: flex; align-items: center; gap: 10px; }
.font-line .name { flex: 1; min-width: 0; }
.font-line .name b { display: block; font-size: 14.5px; }
.font-line .name span { font-size: 12.5px; }
.badge { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.badge.ok { background: var(--green-soft); color: var(--green-text); }
.badge.warn { background: var(--amber-soft); color: var(--amber-text); }

/* ----------------------------------------------------- шторка (sheet) */

.sheet { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop { position: absolute; inset: 0; background: var(--backdrop); animation: fadein .18s; }
.sheet-card {
  position: relative; width: 100%; max-height: calc(var(--app-h) - 40px);
  display: flex; flex-direction: column;
  background: var(--surface); border-radius: 22px 22px 0 0;
  box-shadow: var(--shadow-pop); animation: slideup .22s ease;
  padding-bottom: var(--safe-b);
}
.sheet-grab { width: 40px; height: 5px; border-radius: 999px; background: var(--line-strong); margin: 8px auto 0; flex: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 4px 20px; flex: none; }
.sheet-head h3 { font-size: 19px; font-weight: 800; }
.sheet-body { overflow-y: auto; padding: 6px 20px 20px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
@keyframes slideup { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

.sheet-group { margin-bottom: 18px; }
.sheet-group:last-child { margin-bottom: 0; }
.sheet-group h4 { margin: 0 0 10px; font-size: 13px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.sheet-list { display: flex; flex-direction: column; gap: 8px; }
.sheet-list .btn { justify-content: flex-start; height: 52px; border-radius: 14px; padding: 0 16px; }
.sheet-list .btn .sub { margin-left: auto; color: inherit; opacity: .6; font-weight: 600; font-size: 13.5px; }
.sheet-note { color: var(--muted); font-size: 13px; margin-top: 10px; }

.layout-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.layout-opt {
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface);
  padding: 6px 6px 8px; display: flex; flex-direction: column; gap: 6px; text-align: left;
}
.layout-opt:hover { border-color: var(--line-strong); }
.layout-opt.current { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
.layout-opt canvas { width: 100%; height: auto; display: block; border-radius: 8px; background: #000; }
.layout-opt span { font-size: 12.5px; font-weight: 700; line-height: 1.25; padding: 0 2px; }

.progress { height: 6px; border-radius: 999px; background: var(--well); overflow: hidden; margin-top: 12px; }
.progress div { height: 100%; width: 0; background: var(--blue); transition: width .2s; }

.help { font-size: 14.5px; line-height: 1.55; }
.help h4 { font-size: 15px; font-weight: 800; margin: 16px 0 6px; }
.help h4:first-child { margin-top: 0; }
.help p { margin: 0 0 8px; }
.help ul { margin: 0 0 8px; padding-left: 20px; }
.help kbd { font: inherit; font-size: 12.5px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: var(--well); }

/* --------------------------------------------------- просмотр карусели */

.viewer {
  position: fixed; left: 0; top: var(--app-top); width: 100%; height: var(--app-h); z-index: 55;
  background: #0B0B0C; display: flex; flex-direction: column; animation: fadein .15s;
}
.viewer-top {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  height: calc(56px + var(--safe-t)); padding: var(--safe-t) 8px 0 20px; color: #fff;
}
.viewer-top .icon-btn { color: #fff; }
.viewer-top .icon-btn:hover { background: rgba(255, 255, 255, .12); }
.viewer-count { font-weight: 700; font-variant-numeric: tabular-nums; }
.viewer-track {
  flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  padding-bottom: var(--safe-b);
}
.viewer-track::-webkit-scrollbar { display: none; }
.viewer-slide {
  flex: none; width: 100%; height: 100%; scroll-snap-align: center; scroll-snap-stop: always;
  display: flex; align-items: center; justify-content: center;
}
.viewer-slide canvas { display: block; border-radius: 4px; }

/* ------------------------------------------------------------ прочее */

/* сообщения — сверху: снизу на телефоне клавиатура и поля формы */
.status {
  position: fixed; left: 50%; top: calc(var(--app-top) + 64px + var(--safe-t)); z-index: 60;
  transform: translate(-50%, -12px); opacity: 0; pointer-events: none;
  max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 14px;
  background: var(--primary-bg); color: var(--primary-text); font-weight: 600; font-size: 14.5px;
  box-shadow: var(--shadow-pop); transition: opacity .2s, transform .2s; text-align: center;
}
.status.show { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 900px) {
  .status { top: auto; bottom: 24px; transform: translate(-50%, 12px); }
}

.drop-hint {
  position: fixed; inset: 12px; z-index: 70; border: 3px dashed var(--blue); border-radius: 22px;
  background: var(--blue-soft); display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 800; color: var(--blue-text); pointer-events: none;
}

.install-banner {
  position: fixed; left: 12px; right: 12px; bottom: calc(12px + var(--safe-b)); z-index: 40;
  display: flex; align-items: center; gap: 10px; padding: 10px 8px 10px 16px;
  border-radius: 16px; background: var(--primary-bg); color: var(--primary-text);
  box-shadow: var(--shadow-pop); font-size: 14px; font-weight: 600;
}
.install-banner span { flex: 1; }
.install-banner .icon-btn { color: var(--primary-text); }
.install-banner .icon-btn:hover { background: rgba(127, 127, 127, .2); }

/* ------------------------------------------- правка текста на превью */
.text-marks { position: absolute; inset: 0; pointer-events: none; }
.text-mark {
  position: absolute; border-radius: 6px; border: 1.5px dashed rgba(255, 255, 255, .85);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .35), inset 0 0 0 1px rgba(0, 0, 0, .2);
}
.text-mark.on { border: 2px solid #3D8BFD; box-shadow: 0 0 0 1px rgba(255, 255, 255, .75); }
.text-mark[hidden] { display: none; }

.quick-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.quick-title { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.quick-title b { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quick-title span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quick-done { flex: none; height: 34px !important; }
.quick-field { margin-bottom: 0; }
.quick-field:not(.rich-field) .field-label,
.quick-field .field-hint,
.quick-field .field-label > span:first-child { display: none; }
.quick-field.rich-field .field-label { justify-content: flex-start; position: static; padding: 0; margin: 0 0 6px; }
.quick-field .rich.big { min-height: 64px; }

/* ------------------------------------------------ телефон: печатаем */
/* Клавиатура открыта — превью уменьшается, лента прячется, чтобы над
   полем было видно, как меняется слайд. */
@media (max-width: 899px) {
  /* предупреждения — плашкой поверх низа превью, отдельная строка не нужна */
  .stage-pane { position: relative; }
  .stage { height: calc(var(--app-h) * .45 - 8px); }
  .stage-foot {
    position: absolute; left: 0; right: 0; bottom: 0; min-height: 0;
    padding: 0 8px 6px; pointer-events: none; justify-content: center;
  }
  .stage-foot .warnings { flex: none; justify-content: center; }
  .stage-foot .warn, .stage-foot .warnings .btn { pointer-events: auto; }
  .stage-foot .warn {
    background: var(--surface); padding: 5px 10px; border-radius: 999px;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .18);
  }
  .stage-foot .warn.ok, .stage-foot .counter { display: none; }
  .stage-foot .warnings .btn { background: var(--surface); box-shadow: 0 2px 10px rgba(0, 0, 0, .18); }

  .editor.typing .stage { height: calc(var(--app-h) * .36 - 16px); min-height: 150px; padding: 8px; }
  .editor.typing .slides-pane,
  .editor.typing .stage-foot,
  .editor.typing .stage-nav { display: none; }
  .hide-sm { display: none !important; }

  /* быстрая правка (нажали на текст на превью): превью — всё, что осталось
     над полем, ленты и вкладок нет */
  .editor.quick .slides-pane, .editor.quick .tabs, .editor.quick .stage-nav { display: none; }
  .editor.quick .stage-pane { flex: 1 1 auto; min-height: 0; }
  .editor.quick .stage, .editor.quick.typing .stage { flex: 1 1 auto; height: auto; min-height: 0; padding: 8px; }
  .editor.quick .panel { flex: 0 0 auto; max-height: calc(var(--app-h) * .5); box-shadow: 0 -6px 18px rgba(0, 0, 0, .12); }
  .editor.quick .panel-body { padding: 8px 12px calc(10px + var(--safe-b)); }

  /* компактнее: второстепенное — ниже и мельче, чтобы на экране было больше полей */
  .topbar { height: calc(48px + var(--safe-t)); padding-left: 4px; padding-right: 6px; }
  .topbar .icon-btn { width: 40px; height: 40px; }
  .topbar .icon-btn svg { width: 20px; height: 20px; }
  .btn-export { height: 36px; }
  .slides-list { gap: 7px; padding: 6px 10px; }
  .slide-item { width: 36px; }
  .slide-thumb { border-radius: 5px; }
  .slide-num { left: 2px; bottom: 2px; min-width: 14px; height: 14px; padding: 0 3px; font-size: 9.5px; }
  .slide-dot { right: 2px; top: 2px; width: 8px; height: 8px; }
  .slide-video { left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 4px; }
  .slide-video [data-icon] { width: 10px; height: 10px; }
  .slide-add { width: 36px; font-size: 0; }
  .slide-add svg { width: 18px; height: 18px; }
  .tabs { padding: 0 8px; }
  .tab { height: 36px; font-size: 14px; padding: 0 10px; }
  .panel-body { padding: 10px 14px calc(22px + var(--safe-b)); }
  .form-head { margin-bottom: 6px; gap: 8px; }
  .form-kicker { display: none; }
  .form-title { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .form-head .btn { height: 30px; padding: 0 11px; font-size: 13px; }
  .section { padding: 10px 0; }
  .section-title { font-size: 14px; margin-bottom: 8px; }
  .section-title .btn { height: 28px; padding: 0 10px; font-size: 12.5px; }
  .field { gap: 4px; margin-bottom: 10px; }
  .field-label { font-size: 13px; }
  .field-label > .muted, .rich-field > .field-hint, .photo-hint, .tone-hint { display: none; }
  .input, .textarea { padding: 8px 12px; border-radius: 10px; }
  .textarea { min-height: 40px; }
  .rich.big { min-height: 76px; }
  .rich.is-empty::before { top: 8px; left: 13px; }
  .fmt-btn { height: 28px; min-width: 32px; }
  .subblock { margin: 12px 0 10px; padding-top: 8px; }
  .btn-sm { height: 32px; padding: 0 12px; font-size: 13.5px; }
  .actions-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .actions-grid .btn { height: 38px; padding: 0; gap: 0; font-size: 0; }
  .photo-thumb { width: 48px; height: 48px; border-radius: 10px; }
  .range-row { margin-bottom: 6px; }
  .switch-row { min-height: 38px; }
  .switch-row .lbl, .look-row .lbl { font-size: 14px; }
  .look-row { min-height: 36px; margin-bottom: 4px; }
  .look-row .seg button { height: 30px; }
  .seg button { height: 32px; font-size: 13.5px; }
  .look-all { margin: 0 0 6px; }
  .logo-row { padding: 2px 0 4px; }
  .logo-pick { width: 88px; height: 110px; }
  .logo-pick.tall { width: 76px; height: 132px; }
  .logo-pick button { min-height: 0; }
}
@media (max-width: 380px) {
  .export-label { display: none; }
  .btn-export { width: 44px; padding: 0 !important; }
}
@media (max-width: 420px) {
  .btn-export { padding: 0 12px; }
  .stage-foot .warn, .stage-foot .warnings .btn { font-size: 12px; }
  .topbar .icon-btn { width: 40px; }
  .range-row { grid-template-columns: 92px minmax(0, 1fr) 44px; }
}

/* ------------------------------------------------------ планшет/комп */
@media (min-width: 640px) {
  .rubric-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .sheet { align-items: center; }
  .sheet-card { width: min(560px, calc(100% - 32px)); border-radius: 22px; max-height: calc(100vh - 64px); padding-bottom: 0; }
  .sheet-grab { display: none; }
  .layout-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .draft-card { width: 170px; }
}
@media (min-width: 980px) {
  .rubric-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .screen.home { padding-top: 24px; }
}

@media (min-width: 900px) {
  .screen.editor { position: fixed; top: 0; height: 100vh; }
  .workspace {
    flex-direction: row;
    display: grid; grid-template-columns: 180px minmax(0, 1fr) 380px;
  }
  .slides-pane {
    grid-column: 1; grid-row: 1; border-bottom: 0; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .slides-list {
    flex-direction: column; overflow-x: hidden; overflow-y: auto; gap: 14px;
    padding: 14px 14px 20px; scroll-snap-type: none; flex: 1;
  }
  .slide-item { width: 100%; cursor: grab; }
  .slide-label {
    display: block; margin-top: 6px; font-size: 12.5px; font-weight: 600; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .slide-item.current .slide-label { color: var(--text); }
  .slide-tools {
    position: absolute; top: 6px; right: 6px; display: none; flex-direction: column; gap: 4px;
  }
  .slide-item:hover .slide-tools, .slide-item.current .slide-tools { display: flex; }
  .slide-tools button {
    width: 28px; height: 28px; border-radius: 999px; border: 0; padding: 0;
    background: rgba(255, 255, 255, .92); color: #0B0B0C; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .2);
  }
  .slide-tools button svg { width: 15px; height: 15px; }
  .slide-tools button.del { color: var(--red); }
  .slide-add { width: 100%; aspect-ratio: auto; height: 64px; flex-direction: row; gap: 8px; font-size: 14px; }

  .stage-pane { grid-column: 2; grid-row: 1; min-height: 0; }
  .stage { flex: 1; height: auto; padding: 28px; }
  .stage-nav { width: 40px; height: 40px; }
  .stage-nav.prev { left: 14px; }
  .stage-nav.next { right: 14px; }
  .stage-foot { padding: 0 20px 12px; min-height: 48px; }

  .panel { grid-column: 3; grid-row: 1; border-left: 1px solid var(--line); }
  .panel-body { padding: 18px 20px 32px; }
  .topbar { padding: 0 14px; height: 60px; gap: 6px; }
}

@media (min-width: 1280px) {
  .workspace { grid-template-columns: 200px minmax(0, 1fr) 420px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* вкладка «Фото» */
.adj-presets { margin-bottom: 2px; }
.adj-foot { display: flex; margin-top: 10px; }
.adj-compare { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
.adj-compare.on { background: var(--text); color: var(--surface); border-color: var(--text); }
.adj-pick { margin-top: 10px; }
.adjust-form .range-row { grid-template-columns: 124px minmax(0, 1fr) 44px; }
@media (max-width: 899px) {
  .adjust-form .range-row { grid-template-columns: 112px minmax(0, 1fr) 40px; }
}

/* окно «Сохранить»: новая версия, сторис */
.update-note {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 12px 14px; margin-bottom: 14px;
  border-radius: 14px; background: #FEF3BD; color: #111;
}
.update-note[hidden] { display: none; }
.update-text { flex: 1 1 150px; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.update-text b { font-size: 15px; }
.update-note .btn { flex: none; }
.story-box { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
.story-box[hidden] { display: none; }
.story-box canvas { flex: none; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
.story-box .sheet-note { margin: 0; }
.size-row[hidden] { display: none; }
.turn-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.turn-btns .btn { justify-content: center; }

</style>
</head>
<body>

<div class="install-banner" id="installBanner" hidden>
  <span id="installBannerText"></span>
  <button type="button" class="btn btn-invert btn-sm" id="installBannerAction" hidden>Установить</button>
  <button type="button" class="icon-btn" id="installBannerClose" aria-label="Скрыть" data-icon="x"></button>
</div>

<!-- ================================================== стартовый экран -->
<main class="screen home" id="home" aria-label="Проекты">
  <header class="home-head">
    <div class="brand">
      <span class="brand-logo" id="brandLogo" aria-hidden="true"></span>
      <span class="brand-text">

<main class="screen editor" id="editor" hidden aria-label="Редактор">

/*
 * Отрисовка слайдов «Город 24» на Canvas.
 *
 * Все размеры — в единицах макета Figma (пост 1440×1800, рилс 1080×1920)
 * и сняты с него один в один. Масштаб до реального размера картинки
 * задаётся снаружи через ctx.setTransform, поэтому переносы строк в превью
 * и в экспорте одинаковые.
 *
 * Координата «top» у текста — это верх прописных букв, а не верх строки:
 * в макете у всех текстов включён text-box-trim (cap height → baseline),
 * так что в Figma y текстового блока — это ровно линия прописных. Здесь
 * так же: baseline первой строки = top + высота прописных (capRatio).
 *
 * LAYOUTS — единственный источник правды для каждого макета: какие поля,
 * есть ли фото, стрелка, затемнение и сама функция отрисовки. Никаких
 * пиксельных значений вёрстки вне этого файла быть не должно.
 */

/* ------------------------------------------------------------- шрифты */

// Пользовательский шрифт (загружен в «Настройках») идёт первым, за ним
// вшитый при сборке. Букв, которых в нём нет (таджикские ҷ ӣ ӯ ҳ и т. п.,
// см. FONT_MISSING), берутся из Inter — одинаково на любом телефоне, а не
// системным шрифтом. Если ничего не загрузилось — системный sans-serif.
const FONT_FAMILY = {
  title: "'G24TitleUser', 'G24Title', 'G24Body', sans-serif",      // BravoRG
  display: "'G24DisplayUser', 'G24Display', 'G24Body', sans-serif", // Nauryz Red Keds
  body: "'G24Body', sans-serif",                        // Inter
};

// Высота прописных в долях кегля — по макету (высоты текстовых блоков
// с text-box-trim): BravoRG 150px → 105, Nauryz 115px → 82, Inter 60px → 44.
// Реальная высота меряется в браузере (capRatio), эти числа — запас на
// случай, если measureText не отдаёт actualBoundingBoxAscent.
const CAP_DEFAULT = { title: 0.70, display: 0.713, body: 0.727 };

// Пока настоящий шрифт не добавлен, app.js ставит сюда < 1; с настоящим

const INTER_LEAD = 1.21;   // «normal» межстрочный у Inter в Figma

const WHITE = '#ffffff';
// Фирменный кремовый: по переключателю «Фирменный цвет» им красятся светлый
// текст и стрелки на тёмных слайдах, плашки и белый фон карточек.
// Логотип остаётся белым/чёрным, как в макете.
const BRAND_CREAM = '#FEF3BD';

function brandTone(slide) { return Boolean(slide && slide.opts && slide.opts.tone === 'brand'); }
/* Светлый текст и стрелка поверх фото. */
function ink(slide) { return brandTone(slide) ? BRAND_CREAM : WHITE; }
/* Плашки и белый фон карточек (текст на них остаётся чёрным). */
function paper(slide) { return brandTone(slide) ? BRAND_CREAM : WHITE; }
const BLACK = '#000000';
const EVENT_RED = '#700004';

const capCache = new Map();
function resetCapCache() { capCache.clear(); }

function capRatio(ctx, font) {
  if (capCache.has(font)) return capCache.get(font);
  let ratio = CAP_DEFAULT[font];
  ctx.save();
  ctx.font = `400 100px ${FONT_FAMILY[font]}`;
  const m = ctx.measureText('НHЕ');
  ctx.restore();
  if (m && typeof m.actualBoundingBoxAscent === 'number' && m.actualBoundingBoxAscent > 20) {
    ratio = m.actualBoundingBoxAscent / 100;
  }
  capCache.set(font, ratio);
  return ratio;
}

/* ---------------------------------------------------- текст: перенос */

const HAS_LETTER_SPACING = typeof CanvasRenderingContext2D !== 'undefined' &&
  'letterSpacing' in CanvasRenderingContext2D.prototype;

/*
 * Короткие служебные слова не должны оставаться в конце строки —
 * такое слово переносится вместе со следующим.
 */
const GLUE_WORDS = new Set([
  'в', 'во', 'на', 'к', 'ко', 'с', 'со', 'у', 'о', 'об', 'обо', 'от', 'ото',
  'до', 'из', 'изо', 'за', 'по', 'под', 'над', 'при', 'про', 'для', 'без',
  'не', 'ни', 'и', 'а', 'но', 'да', 'же', 'ли', 'бы', 'то', 'как', 'что',
  'или', 'их', 'его', 'её', 'ее', 'мы', 'вы', 'он', 'она', 'они', 'я',
  'a', 'an', 'the', 'in', 'on', 'at', 'to', 'of', 'by', 'is', 'or', 'and',
]);

function isGlueWord(text) {
  const clean = text.replace(/[«»"'(„“]/g, '').toLowerCase();
  return clean.length > 0 && (clean.length <= 2 || GLUE_WORDS.has(clean));
}

const HYPHENS = '-‐–';

/* Слово с дефисами → куски, после каждого дефиса можно перенести строку
   (как в Figma: «Каракол-» / «Корумду»). */
function splitHyphens(word) {
  const out = [];
  let cur = '';
  for (let i = 0; i < word.length; i++) {
    cur += word[i];
    if (HYPHENS.includes(word[i]) && i > 0 && i < word.length - 1 && !HYPHENS.includes(word[i + 1])) {
      out.push(cur);
      cur = '';
    }
  }
  if (cur) out.push(cur);
  return out;
}

function setTracking(ctx, px) {
  if (HAS_LETTER_SPACING) ctx.letterSpacing = (px || 0).toFixed(2) + 'px';
}

function measureTracked(ctx, text, track, stretch = 1) {
  const w = ctx.measureText(text).width;
  return (HAS_LETTER_SPACING ? w : w + (track || 0) * [...text].length) * stretch;
}

function fillTracked(ctx, text, x, y, track) {
  if (HAS_LETTER_SPACING || !track) { ctx.fillText(text, x, y); return; }
  // старые браузеры без ctx.letterSpacing — посимвольно
  let cx = x;
  for (const ch of text) {
    ctx.fillText(ch, cx, y);
    cx += ctx.measureText(ch).width + track;
  }
}

/*
 * Жирный, курсив, цвет слов и маркер внутри текста (кнопки в форме, вставка
 * с форматированием). Хранятся рядом с текстом: slide.fmt[key] — отрезки
 * [длина, флаги] подряд, сумма длин = длина текста. Флаги: 1 — жирный,
 * 2 — курсив, 4 — красный, 8 — кремовый, 16 — маркер (кремовая плашка за
 * словами, текст на ней чёрный). Не сходится с текстом — игнорируем.
 */
const BOLD = 1, ITALIC = 2, RED = 4, CREAM = 8, MARK = 16;
const STYLE_BITS = BOLD | ITALIC;       // нужны начертания шрифта (есть только у Inter)
const ACCENT_RED = '#700004';           // фирменный красный (название события в макете)

function fieldRuns(slide, key, text) {
  const runs = slide && slide.fmt && slide.fmt[key];
  if (!Array.isArray(runs) || !runs.length) return null;
  let sum = 0;
  for (const r of runs) {
    if (!Array.isArray(r) || !(r[0] > 0)) return null;
    sum += r[0];
  }
  return sum === text.length && runs.some(r => r[1]) ? runs : null;
}

function expandRuns(runs, length) {
  const flags = new Uint8Array(length);
  let i = 0;
  for (const [len, f] of runs) { flags.fill(f & 31, i, Math.min(length, i + len)); i += len; }
  return flags;
}

function fontSpec(st, size, f = 0) {
  const italic = st.italic || (f & ITALIC);
  return `${italic ? 'italic ' : ''}${f & BOLD ? 700 : 400} ${size}px ${FONT_FAMILY[st.font]}`;
}

/* Ширина куска строки: без форматирования — одним замером, с ним — по
   отрезкам одного начертания. m = { ctx, fonts, track, stretch }. */
function measureSlice(m, text, flags, a = 0, b = text.length) {
  if (!flags) return measureTracked(m.ctx, text.slice(a, b), m.track, m.stretch);
  let w = 0;
  for (let i = a; i < b;) {
    let j = i + 1;
    while (j < b && flags[j] === flags[i]) j++;
    m.ctx.font = m.fonts[flags[i] & STYLE_BITS];
    w += measureTracked(m.ctx, text.slice(i, j), m.track, m.stretch);
    i = j;
  }
  m.ctx.font = m.fonts[0];
  return w;
}

/* Абзац: пробелы схлопнуты в один, по краям обрезаны (флаги — вместе с текстом). */
function normalizePara(raw, flags) {
  if (!flags) return { text: raw.split(/\s+/).filter(Boolean).join(' '), flags: null };
  let text = '';
  const out = [];
  let space = false;
  for (let i = 0; i < raw.length; i++) {
    if (/\s/.test(raw[i])) { space = text.length > 0; continue; }
    if (space) { text += ' '; out.push(flags[i - 1] || 0); space = false; }
    text += raw[i];
    out.push(flags[i]);
  }
  const f = Uint8Array.from(out);
  return { text, flags: f.some(Boolean) ? f : null };
}

function sliceLine(para, a, b) {
  const flags = para.flags ? para.flags.slice(a, b) : null;
  return { text: para.text.slice(a, b), flags: flags && flags.some(Boolean) ? flags : null };
}

/* Абзац (без \n) → строки по ширине. */
function wrapLine(m, para, maxWidth) {
  const text = para.text;
  // неразрывные куски: слова и части слова через дефис (с позициями в тексте)
  const units = [];
  let pos = 0;
  for (const word of text.split(' ')) {
    let s = pos;
    splitHyphens(word).forEach((p, j) => {
      units.push({ text: p, start: s, end: s + p.length, sep: j === 0 ? ' ' : '' });
      s += p.length;
    });
    pos += word.length + 1;
  }
  // слово-«клей» переносится вместе со следующим
  const groups = [];
  for (let i = 0; i < units.length; i++) {
    const prev = groups[groups.length - 1];
    const prevUnit = units[i - 1];
    const glued = prev && units[i].sep === ' ' && prevUnit && prevUnit.sep === ' ' &&
      !HYPHENS.includes(prevUnit.text.slice(-1)) && isGlueWord(prevUnit.text);
    if (glued) prev.end = units[i].end;
    else groups.push({ start: units[i].start, end: units[i].end });
  }
  const lines = [];
  let ls = -1, le = -1;
  const limit = maxWidth * 1.002;
  for (const g of groups) {
    if (ls < 0) { ls = g.start; le = g.end; continue; }
    if (measureSlice(m, text, para.flags, ls, g.end) <= limit) le = g.end;
    else { lines.push(sliceLine(para, ls, le)); ls = g.start; le = g.end; }
  }
  if (ls >= 0) lines.push(sliceLine(para, ls, le));
  return lines;
}

/*
 * Текстовый блок: раскладывает текст по строкам и считает высоту.
 * height — от верха прописных первой строки до базовой линии последней
 * (так же, как высоты текстов в макете с text-box-trim).
 * runs — жирный/курсив (см. fieldRuns), null — весь текст одним начертанием.
 */
function textBlock(ctx, text, st, scale = 1, maxWidth = 1e6, runs = null) {
  const size = st.size * scale;
  const lead = st.lead ? st.lead * scale : size * INTER_LEAD;
  const track = (st.track || 0) * scale;
  const fonts = [0, 1, 2, 3].map(f => fontSpec(st, size, f));
  const font = fonts[0];
  const stretch = FONT_STRETCH[st.font] || 1;
  const str = String(text || '');
  const flags = runs ? expandRuns(runs, str.length) : null;
  ctx.save();
  ctx.font = font;
  setTracking(ctx, track);
  const m = { ctx, fonts, track, stretch };
  const lines = [];
  let pos = 0;
  for (const raw of str.split('\n')) {
    const para = normalizePara(raw, flags ? flags.subarray(pos, pos + raw.length) : null);
    pos += raw.length + 1;
    if (!para.text) { lines.push({ text: '', width: 0, flags: null, last: true }); continue; }
    const wrapped = wrapLine(m, para, maxWidth);
    wrapped.forEach((l, i) => {
      l.width = measureSlice(m, l.text, l.flags);
      l.last = i === wrapped.length - 1;   // последняя строка абзаца — без растяжки по ширине
      lines.push(l);
    });
  }
  ctx.restore();
  // пустые строки по краям блока не рисуются и места не занимают
  while (lines.length && !lines[0].text) lines.shift();
  while (lines.length && !lines[lines.length - 1].text) lines.pop();
  const cap = capRatio(ctx, st.font) * size;
  const height = lines.length ? cap + (lines.length - 1) * lead : 0;
  const width = lines.reduce((mx, l) => Math.max(mx, l.width), 0);
  return { lines, size, lead, track, font, fonts, cap, height, width, maxWidth, st, stretch };
}

/*
 * Рисует блок: x — левый край колонки шириной boxW (по умолчанию ширина
 * переноса блока), align — left / center / right / justify (по ширине:
 * пробелы растягиваются, последняя строка абзаца — по левому краю).
 */
function drawBlock(ctx, b, x, capTop, color, align = 'left', alpha = 1, boxW = b && b.maxWidth) {
  if (!b || !b.lines.length) return;
  if (textHits && b.key) recordTextHit(b, x, capTop, align, boxW, color);
  if (skipText) return;
  ctx.save();
  ctx.font = b.font;
  setTracking(ctx, b.track);
  ctx.fillStyle = color;
  ctx.globalAlpha *= alpha;
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  let base = capTop + b.cap;
  for (const line of b.lines) {
    if (line.text) {
      let lx = x, gap = 0;
      if (align === 'center') lx = x + (boxW - line.width) / 2;
      else if (align === 'right') lx = x + boxW - line.width;
      else if (align === 'justify' && !line.last) {
        const spaces = line.text.split(' ').length - 1;
        if (spaces) gap = Math.max(0, (boxW - line.width) / spaces);
      }
      if (line.flags || gap) drawRichLine(ctx, b, line, lx, base, gap, color);
      else drawPiece(ctx, b, line.text, lx, base);
    }
    base += b.lead;
  }
  ctx.restore();
}

function drawPiece(ctx, b, text, x, base) {
  if (b.stretch !== 1) {
    ctx.save();
    ctx.translate(x, 0);
    ctx.scale(b.stretch, 1);
    fillTracked(ctx, text, 0, base, b.track);
    ctx.restore();
  } else {
    fillTracked(ctx, text, x, base, b.track);
  }
}

/*
 * Где на слайде лежит текст каждого поля — для правки прямо на превью
 * (нажали на текст → редактируем это поле) и проверок (буквы, контраст).
 * renderSlide собирает их в res.texts: { key, x, y, w, h, font, size, color, ghost } в
 * единицах макета, по видимым строкам (с запасом на выносные элементы).
 */
let textHits = null;
let skipText = false;   // env.noText: всё, кроме текста (фон под ним — для проверки контраста)

function recordTextHit(b, x, capTop, align, boxW, color) {
  let x0 = Infinity, x1 = -Infinity;
  for (const line of b.lines) {
    if (!line.text) continue;
    let lx = x, w = line.width;
    if (align === 'center') lx = x + (boxW - w) / 2;
    else if (align === 'right') lx = x + boxW - w;
    else if (align === 'justify' && !line.last) w = Math.max(w, boxW);
    x0 = Math.min(x0, lx);
    x1 = Math.max(x1, lx + w);
  }
  const top = capTop - b.size * 0.12;
  const bottom = capTop + b.height + b.size * 0.24;
  textHits.push({ key: b.key, x: x0, y: top, w: Math.max(0, x1 - x0), h: bottom - top,
    font: b.st.font, size: b.size, color, ghost: Boolean(b.ghost) });
}

/* Строка по кускам: смена начертания / цвета, маркер и (при выравнивании
   по ширине) пробелы. Сначала раскладываем куски, потом рисуем плашки
   маркера (слитно через пробелы между выделенными словами), потом текст. */
function drawRichLine(ctx, b, line, x, base, gap, color) {
  const { text, flags } = line;
  const m = { ctx, fonts: b.fonts, track: b.track, stretch: b.stretch };
  const pieces = [];
  let cx = x;
  for (let i = 0; i < text.length;) {
    const f = flags ? flags[i] : 0;
    let j = i + 1;
    if (text[i] !== ' ' || !gap) {
      while (j < text.length && (flags ? flags[j] : 0) === f && !(gap && text[j] === ' ')) j++;
    }
    const piece = text.slice(i, j);
    ctx.font = b.fonts[f & STYLE_BITS];
    const w = measureSlice(m, piece, null) + (gap && piece === ' ' ? gap : 0);
    pieces.push({ text: piece, f, x: cx, w });
    cx += w;
    i = j;
  }
  // плашки маркера: от верха прописных с запасом до низа выносных
  const padX = b.size * 0.14, padTop = b.size * 0.2, padBottom = b.size * 0.26;
  ctx.save();
  ctx.fillStyle = b.markerColor || BRAND_CREAM;
  for (let k = 0; k < pieces.length; k++) {
    if (!(pieces[k].f & MARK)) continue;
    let e = k;
    while (e + 1 < pieces.length && pieces[e + 1].f & MARK) e++;
    // пробел по краю выделения плашку не продлевает
    let s0 = k, e0 = e;
    while (s0 < e0 && pieces[s0].text.trim() === '') s0++;
    while (e0 > s0 && pieces[e0].text.trim() === '') e0--;
    const x0 = pieces[s0].x - padX, x1 = pieces[e0].x + pieces[e0].w + padX;
    roundRect(ctx, x0, base - b.cap - padTop, x1 - x0, b.cap + padTop + padBottom, b.size * 0.12);
    ctx.fill();
    k = e;
  }
  ctx.restore();
  for (const p of pieces) {
    if (p.text.trim() === '') continue;
    ctx.font = b.fonts[p.f & STYLE_BITS];
    ctx.fillStyle = p.f & MARK ? BLACK : p.f & RED ? ACCENT_RED : p.f & CREAM ? BRAND_CREAM : color;
    drawPiece(ctx, b, p.text, p.x, base);
  }
  ctx.font = b.font;
  ctx.fillStyle = color;
}

/*
 * Выравнивание и расположение текста — на слайде (opts.align / opts.valign,
 * переключатели в «Оформлении»), по умолчанию — как в макете (L.align /
 * L.valign). Каждый макет задаёт свою область для текста; placeIn ставит в
 * неё колонку высотой h.
 */
const ALIGNS = ['left', 'center', 'right', 'justify'];
const VALIGNS = ['top', 'middle', 'bottom'];

function textAlign(slide, L) {
  const v = slide && slide.opts && slide.opts.align;
  return ALIGNS.includes(v) ? v : (L.align || 'left');
}
function textVAlign(slide, L) {
  const v = slide && slide.opts && slide.opts.valign;
  return VALIGNS.includes(v) ? v : (L.valign || 'bottom');
}

/* Верх колонки высотой h в области [top, bottom]: сверху, снизу или по
   центру (center — своя середина, если она не посередине области). */
function placeIn(h, top, bottom, valign, center = (top + bottom) / 2) {
  if (valign === 'top') return top;
  if (valign === 'bottom') return bottom - h;
  return Math.min(Math.max(center - h / 2, top), Math.max(top, bottom - h));
}

/* Блок одной строкой в ряд (число + подпись) не растягиваем по ширине. */
function rowAlign(align) { return align === 'justify' ? 'left' : align; }

/* Псевдоблок для stackDown: плашка или ряд заданной высоты. */
function boxBlock(height, on = true) {
  return { lines: on ? [true] : [], height: on ? height : 0 };
}

/* ------------------------------------------------------- фон и детали */

// Сетка линий на белых карточках: группа «линии на фоне», повёрнута на 6°,
// линии 1px чёрные с прозрачностью 15%. Координаты начала каждой линии —
// из макета (relativeTransform).
const GRID = {
  cos: 0.9945176839828491, sin: 0.10456832498311996,
  hLen: 3160.97, vLen: 2366.05,
  h: [[-1087.96, -246.15], [-1014.62, 451.40], [-977.94, 800.18], [-941.27, 1148.95],
      [-904.60, 1497.72], [-867.93, 1846.51]],
  v: [[-531.63, -276.43], [-182.86, -313.11], [165.92, -349.78], [514.69, -386.45],
      [863.47, -423.12], [1212.24, -459.80], [1561.02, -496.47], [1909.80, -533.14]],
};

function drawGrid(ctx) {
  ctx.save();
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (const [x, y] of GRID.h) {
    ctx.moveTo(x, y);
    ctx.lineTo(x + GRID.hLen * GRID.cos, y - GRID.hLen * GRID.sin);
  }
  for (const [x, y] of GRID.v) {
    ctx.moveTo(x, y);
    ctx.lineTo(x + GRID.vLen * GRID.sin, y + GRID.vLen * GRID.cos);
  }
  ctx.stroke();
  ctx.restore();
}

/* «Тень» — градиент от прозрачного к чёрному снизу карточки. */
function drawShade(ctx, W, H, top, strength) {
  if (!(strength > 0)) return;
  const g = ctx.createLinearGradient(0, top, 0, H);
  g.addColorStop(0, 'rgba(0, 0, 0, 0)');
  g.addColorStop(1, `rgba(0, 0, 0, ${Math.min(1, strength)})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, top, W, H - top);
}

/* Тень под текстом там, где он стоит: снизу — как в макете, сверху — то же
   зеркально, по центру — полоса с серединой на центре текста (мягче:
   чёрный во всю силу посреди кадра слишком тяжёлый). */
const SHADE_MIDDLE = 0.75;

function drawShadeFor(ctx, W, H, top, strength, valign, center) {
  if (!(strength > 0)) return;
  const a = Math.min(1, strength);
  const span = H - top;
  if (valign === 'bottom') { drawShade(ctx, W, H, top, strength); return; }
  if (valign === 'top') {
    const g = ctx.createLinearGradient(0, 0, 0, span);
    g.addColorStop(0, `rgba(0, 0, 0, ${a})`);
    g.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, span);
    return;
  }
  const g = ctx.createLinearGradient(0, center - span, 0, center + span);
  g.addColorStop(0, 'rgba(0, 0, 0, 0)');
  g.addColorStop(0.5, `rgba(0, 0, 0, ${a * SHADE_MIDDLE})`);
  g.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// Логотип: в макете это маска 152×129 в правом верхнем углу (1198, 149),
// залитая белым или чёрным. Видимая часть знака — 1198…1350 × 148…278.
const LOGO_BOX = { x: 1198, y: 148, w: 152, h: 130 };
const LOGO_BOX_BOTTOM = { x: 1198, y: 1520, w: 152, h: 130 };

/*
 * Логотип можно поставить в одну из 8 точек (opts.logo, переключатель в
 * «Оформлении»): углы и середины сторон. По умолчанию — где в макете
 * (L.logo, его рамка — та, что передал макет). Точки — в рамке
 * L.logoFrame: у постов поля 90 по бокам, 148 сверху и 150 снизу (как
 * у логотипа и текста в макете), у рилс — безопасная зона обложки.
 */
const LOGO_SPOTS = ['tl', 'tc', 'tr', 'ml', 'mr', 'bl', 'bc', 'br'];
const LOGO_FRAME_POST = { x0: 90, x1: 1350, y0: 148, y1: 1650 };

function logoSpot(slide, L) {
  const v = slide && slide.opts && slide.opts.logo;
  return LOGO_SPOTS.includes(v) ? v : (L.logo || 'tr');
}

function logoBox(slide, L, def) {
  const spot = logoSpot(slide, L);
  if (spot === (L.logo || 'tr')) return def;   // как в макете — рамка из макета без пересчёта
  const f = L.logoFrame || LOGO_FRAME_POST;
  const x = spot[1] === 'l' ? f.x0 : spot[1] === 'c' ? (f.x0 + f.x1 - def.w) / 2 : f.x1 - def.w;
  const y = spot[0] === 't' ? f.y0 : spot[0] === 'm' ? (f.y0 + f.y1 - def.h) / 2 : f.y1 - def.h;
  return { x, y, w: def.w, h: def.h };
}

function drawLogo(ctx, env, box, color) {
  const logo = color === BLACK ? env.assets.logoBlack : env.assets.logoWhite;
  if (!logo) return;
  const iw = logo.width, ih = logo.height;
  const s = Math.min(box.w / iw, box.h / ih);
  const w = iw * s, h = ih * s;
  ctx.drawImage(logo, box.x + (box.w - w) / 2, box.y + (box.h - h) / 2, w, h);
}

// Стрелка «листай дальше»: линия 61px, толщина 10, скруглённые концы,
// наконечник-«галочка» под 45°.
const ARROW_X = 1285;   // левый край стрелки

function drawArrow(ctx, color, y = 1687) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(ARROW_X, y);
  ctx.lineTo(1346, y);
  ctx.moveTo(1346 - 32.5, y - 32.5);
  ctx.lineTo(1346, y);
  ctx.lineTo(1346 - 32.5, y + 32.5);
  ctx.stroke();
  ctx.restore();
}

/* ------------------------------------------------------------- фото */

function mediaSize(img) {
  return [img.naturalWidth || img.videoWidth || img.width, img.naturalHeight || img.videoHeight || img.height];
}

/*
 * Фото «по размеру области с обрезкой» (cover) с масштабом и сдвигом.
 * Сдвиг t.x/t.y — в единицах макета от центра, ограничивается так,
 * чтобы по краям области не было пустот. Возвращает применённый сдвиг.
 */
function drawCover(ctx, img, x, y, w, h, t = {}) {
  const [iw, ih] = mediaSize(img);
  if (!iw || !ih) return { x: 0, y: 0, scale: 1 };
  if (t.rot || t.tilt || t.flipH || t.flipV) return drawCoverTurned(ctx, img, iw, ih, x, y, w, h, t);
  const base = Math.max(w / iw, h / ih);
  const zoom = Math.min(Math.max(t.zoom || 1, 1), 5);
  const s = base * zoom;
  const dw = iw * s, dh = ih * s;
  const mx = (dw - w) / 2, my = (dh - h) / 2;
  const ox = Math.min(Math.max(t.x || 0, -mx), mx);
  const oy = Math.min(Math.max(t.y || 0, -my), my);
  ctx.drawImage(img, x + (w - dw) / 2 + ox, y + (h - dh) / 2 + oy, dw, dh);
  return { x: ox, y: oy, scale: s };
}

/*
 * То же с поворотом и отражением (вкладка «Фото»): t.rot — 0/90/180/270,
 * t.tilt — наклон ±45°, t.flipH / t.flipV — зеркально по горизонтали /
 * вертикали. Отражение — в осях экрана (кнопка «Зеркально» всегда
 * отражает то, что видно), поворот — вокруг центра области. Масштаб
 * подбирается так, чтобы повёрнутое фото закрывало область целиком, а
 * сдвиг ограничивается в осях фото — пустых углов не бывает.
 */
function drawCoverTurned(ctx, img, iw, ih, x, y, w, h, t) {
  const a = ((t.rot || 0) + (t.tilt || 0)) * Math.PI / 180;
  const ca = Math.cos(a), sa = Math.sin(a);
  const bw = w * Math.abs(ca) + h * Math.abs(sa);   // область в осях фото
  const bh = w * Math.abs(sa) + h * Math.abs(ca);
  const zoom = Math.min(Math.max(t.zoom || 1, 1), 5);
  const s = Math.max(bw / iw, bh / ih) * zoom;
  const mx = Math.max(0, (iw * s - bw) / 2), my = Math.max(0, (ih * s - bh) / 2);
  const fx = t.flipH ? -1 : 1, fy = t.flipV ? -1 : 1;
  // сдвиг экрана → оси фото (отразить, повернуть на −a), ограничить, обратно
  const px = (t.x || 0) * fx, py = (t.y || 0) * fy;
  const ix = Math.min(Math.max(ca * px + sa * py, -mx), mx);
  const iy = Math.min(Math.max(-sa * px + ca * py, -my), my);
  const ox = (ca * ix - sa * iy) * fx, oy = (sa * ix + ca * iy) * fy;
  ctx.save();
  ctx.translate(x + w / 2 + ox, y + h / 2 + oy);
  ctx.scale(fx, fy);
  ctx.rotate(a);
  ctx.drawImage(img, -iw * s / 2, -ih * s / 2, iw * s, ih * s);
  ctx.restore();
  return { x: ox, y: oy, scale: s };
}

function drawPhotoRect(ctx, env, x, y, w, h, fallback = BLACK) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  let applied = null;
  if (env.photo) applied = drawCover(ctx, env.photo, x, y, w, h, env.transform);
  else if (fallback) { ctx.fillStyle = fallback; ctx.fillRect(x, y, w, h); }
  ctx.restore();
  return { shape: 'rect', x, y, w, h, deg: 0, applied };
}

/* Фото в повёрнутой рамке (стопка фотографий, полароид). bleed — запас
   за край рамки, чтобы не просвечивал чёрный плейсхолдер под фото. */
function drawPhotoQuad(ctx, env, q, fallback = BLACK) {
  const b = q.bleed || 0;
  ctx.save();
  ctx.translate(q.cx, q.cy);
  ctx.rotate(q.deg * Math.PI / 180);
  ctx.beginPath();
  ctx.rect(-q.w / 2 - b, -q.h / 2 - b, q.w + 2 * b, q.h + 2 * b);
  ctx.clip();
  let applied = null;
  if (env.photo) applied = drawCover(ctx, env.photo, -q.w / 2 - b, -q.h / 2 - b, q.w + 2 * b, q.h + 2 * b, env.transform);
  else if (fallback) { ctx.fillStyle = fallback; ctx.fillRect(-q.w / 2 - b, -q.h / 2 - b, q.w + 2 * b, q.h + 2 * b); }
  ctx.restore();
  return { shape: 'quad', x: q.cx - q.w / 2, y: q.cy - q.h / 2, w: q.w, h: q.h, cx: q.cx, cy: q.cy, deg: q.deg, applied };
}

// Стопка фотографий («фотопленка не удалять!»): картинка стопки и
// повёрнутая на 5,65° область «фото ставить сюда» поверх неё.
const STACK = { x: 182.63, y: 382.83, w: 1069.46, h: 802.6 };
const STACK_PHOTO = { cx: 760.1, cy: 784.6, w: 865.43, h: 593.76, deg: 5.65, bleed: 2 };

// Полароид мероприятий: фото 627×688 повёрнуто на 0,97°, вокруг рамка
// (#FCFCFC, поля 26 / 47 сверху / 131 снизу) с мягкой тенью вверх-вправо.
const POLAROID = { cx: 407.4, cy: 641.2, w: 627.62, h: 687.87, deg: 0.97, bleed: 0.5,
                   side: 26, top: 47, bottom: 131 };

function drawPolaroidFrame(ctx, env) {
  const q = POLAROID;
  const k = env.k || 1;
  ctx.save();
  ctx.translate(q.cx, q.cy);
  ctx.rotate(q.deg * Math.PI / 180);
  const fx = -q.w / 2 - q.side, fy = -q.h / 2 - q.top;
  const fw = q.w + 2 * q.side, fh = q.h + q.top + q.bottom;
  // тень canvas задаётся в пикселях устройства — умножаем на масштаб
  ctx.shadowColor = 'rgba(0, 0, 0, 0.24)';
  ctx.shadowBlur = 22 * k;
  ctx.shadowOffsetX = 6 * k;
  ctx.shadowOffsetY = -6 * k;
  ctx.fillStyle = '#FCFCFC';
  ctx.fillRect(fx, fy, fw, fh);
  ctx.restore();
}

// Скрепка поверх полароида (в макете — картинка «Группа 3 1»):
// рисуется вектором, чтобы не мылилась при любом размере экспорта.
function drawPaperClip(ctx) {
  ctx.save();
  ctx.translate(718, 272);
  ctx.rotate(36 * Math.PI / 180);
  const path = new Path2D();
  path.moveTo(-24, -58);
  path.lineTo(-24, 85);
  path.arc(0, 85, 24, Math.PI, 0, true);
  path.lineTo(24, -89.5);
  path.arc(4.5, -89.5, 19.5, 0, -Math.PI, true);
  path.lineTo(-15, 55);
  path.arc(0, 55, 15, Math.PI, 0, true);
  path.lineTo(15, -52);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.18)';
  ctx.lineWidth = 9;
  ctx.save(); ctx.translate(2.5, 3); ctx.stroke(path); ctx.restore();
  ctx.strokeStyle = '#A3121D';
  ctx.lineWidth = 8;
  ctx.stroke(path);
  ctx.strokeStyle = '#E2454E';
  ctx.lineWidth = 5.2;
  ctx.stroke(path);
  ctx.strokeStyle = 'rgba(255, 214, 214, 0.9)';
  ctx.lineWidth = 1.8;
  ctx.save(); ctx.translate(-1.2, -0.8); ctx.stroke(path); ctx.restore();
  ctx.restore();
}
